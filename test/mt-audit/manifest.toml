[[metrics.anchors]]
file = "crates/agent-metrics/src/lib.rs"
contains = "negative_seam_health_families_stay_label_less"
why = "the runtime regression guard that health families never gain a tenant label"

[[metrics.anchors]]
file = "crates/agent-metrics/src/lib.rs"
contains = "negative_swept_health_families_stay_tenant_less"
why = "the Phase-5 sweep guard that kept-health families stay tenant-less"

# --- spans / logs structural mechanisms ------------------------------------------
[[spans-logs.anchors]]
file = "crates/agent-telemetry/src/otel.rs"
contains = "EnrichSpanProcessor"
why = "the OTEL processor that stamps tenant/session onto every scoped span"

[[spans-logs.anchors]]
file = "crates/agent-telemetry/src/otel.rs"
contains = "identity_attributes"
why = "the pure helper the processor uses to derive span identity attributes"

[[spans-logs.anchors]]
file = "crates/agent-telemetry/src/layer.rs"
contains = "event_scope"
why = "the ClickHouse log layer walks the span scope to inherit tenant/repo/pr onto every log"

[[spans-logs.anchors]]
file = "crates/agent-telemetry/src/layer.rs"
contains = "resolve_dims"
why = "the pure precedence+validation funnel for log dimensions"

[[spans-logs.anchors]]
file = "crates/agent-telemetry/src/rows.rs"
contains = "pub repo: String"
why = "the agent_logs LogRow carries the repo column"

[[spans-logs.anchors]]
file = "crates/agent-telemetry/src/rows.rs"
contains = "pub pr: String"
why = "the agent_logs LogRow carries the pr column"

[[spans-logs.anchors]]
file = "crates/agent-grpc/src/server/mod.rs"
contains = "s.record(\"tenant\", u)"
why = "the shared grpc.server span stamps the validated tenant attribute"

# --- config ownership (C29) ------------------------------------------------------
[config]
# agent.toml is operator-global in full: the tenant-writable set must stay EMPTY.
tenant_writable_empty = true

[[config.anchors]]
file = "crates/agent-runtime/src/config.rs"
contains = "tenant_writable_config_sections"
why = "the C29 codification of operator-vs-tenant config ownership"

[[config.anchors]]
file = "crates/agent-grpc/src/server/config.rs"
contains = "tenant_barred_from_operator_config"
why = "ConfigService bars a non-operator tenant from operator-config writes (C29)"

