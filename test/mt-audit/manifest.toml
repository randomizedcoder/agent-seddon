# mt-audit expectation manifest — the checked-in multi-tenancy coverage baseline.
#
# This is the source of truth `nix run .#mt-audit` reconciles the source against
# (the constants-sync / buf-image governance shape). When you add a gRPC service or a
# metric family, classify it HERE or the audit flags it as unclassified drift.
#
# service class: scoped | field-scoped | stateless | operator-global
#   scoped        every RPC calls identity_key + run_scoped (ambient tenant routing)
#   field-scoped  tenant derived from request fields / a direct capability key
#   stateless     no per-tenant state (tenant irrelevant; span attribution only)
#   operator-global  deliberately process-global (operator config, RBAC-gated)
# status = "gap" marks a KNOWN coverage gap (reported, labeled) pending a fix.

# --- gRPC services ---------------------------------------------------------------
[services.AgentSessionService]
class = "field-scoped"
note = "identity_key addresses the live session directly"

[services.AstService]
class = "stateless"

[services.ConfigService]
class = "scoped"

[services.ContextService]
class = "stateless"

[services.DigestService]
class = "scoped"

[services.DimensionService]
class = "scoped"

[services.EmbedService]
class = "stateless"

[services.Episodic]
class = "scoped"
status = "gap"
note = "span-only while sibling MemoryService scopes; confirm intent in PR2"

[services.FactCollectorService]
class = "stateless"

[services.ForgeRegistryService]
class = "scoped"
note = "every RPC scopes via identity_key + run_scoped (mt-audit-04); PerTenant<ForgeRegistry> routes the caller's tenant"

[services.ForgeService]
class = "stateless"

[services.GraphService]
class = "scoped"

[services.LlmPoolService]
class = "stateless"

[services.LspService]
class = "stateless"

[services.Memory]
class = "scoped"

[services.MetricsProxyService]
class = "stateless"

[services.ModeService]
class = "stateless"

[services.Policy]
class = "stateless"

[services.PromptService]
class = "scoped"

[services.Provider]
class = "stateless"

[services.ProviderRegistryService]
class = "scoped"

[services.PtyService]
class = "stateless"

[services.ReferenceService]
class = "stateless"

[services.RepoService]
class = "stateless"

[services.ReviewFleetService]
class = "scoped"

[services.RoleService]
class = "operator-global"
note = "role catalog is operator-global; RBAC-gated, not tenant-partitioned"

[services.SandboxService]
class = "stateless"

[services.ScannerService]
class = "stateless"

[services.SchedulerService]
class = "scoped"
note = "every RPC scopes via identity_key + run_scoped (mt-audit-02); PerTenant<Scheduler> routes the caller's tenant"

[services.SearchService]
class = "scoped"
note = "every RPC scopes via identity_key + run_scoped (mt-audit-03); reindex re-scopes inside its detached spawn; PerTenant<SearchBackend> routes the caller's tenant"

[services.Semantic]
class = "scoped"
status = "gap"
note = "span-only while sibling MemoryService scopes; confirm intent in PR2"

[services.SessionRegistryService]
class = "field-scoped"
note = "key_of(req.user, req.session_id) from request fields"

[services.SessionService]
class = "field-scoped"
note = "session-id-addressed RPCs key by full id; bare-capability-id RPCs (restore/diff) scope to authorize"

[services.TaskService]
class = "stateless"

[services.TokenizerService]
class = "stateless"

[services.ToolService]
class = "stateless"

[services.TransportRegistryService]
class = "scoped"
note = "every RPC scopes via identity_key + run_scoped (mt-audit-05); PerTenant<TransportRegistry> routes the caller's tenant"

[services.WebSearchService]
class = "stateless"

[services.WebService]
class = "stateless"

