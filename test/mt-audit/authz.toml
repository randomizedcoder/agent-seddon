# mt-audit sub-check 6 (authz-coverage, security-hardening S7): the permission every
# served RPC needs, as the auth layer enforces it (`gate_of` in
# crates/agent-grpc/src/server/authz_policy.rs). The audit fails when the two differ, so a
# new RPC, or a changed permission, shows up here for review.
#
#   "action:resource"                a verified caller needs this permission in its tenant
#   "field-checked:action:resource"  that permission, plus a handler check on the object
#                                    (watching a session someone else owns; another
#                                    tenant's sign-in sessions)
#   "authenticated"                  any verified caller (WhoAmI, Logout, own sessions)
#   "public"                         no bearer at all (Exchange, Jwks, Refresh)
#
# Regenerate after an intentional change with `python3 test/mt-audit/audit.py --dump-authz`,
# then review the diff.

