[package]
name = "agent-tokenizer"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The `approx` backend is dependency-free, deterministic, and always available —
# the default. Real BPE/provider backends (`tokenizer-tiktoken`, `tokenizer-hf`,
# `tokenizer-provider`) are reserved for a follow-up so the default build stays
# hermetic (no bundled vocab / network). See docs/components/tokenizer.md.
default = ["tokenizer-approx"]
tokenizer-approx = []
# Exact OpenAI-family BPE counts via the offline `tiktoken-rs` crate (vendored
# `cl100k_base`/`o200k_base` ranks). Off by default so `nix build .#agent` stays
# dependency-free; a model tiktoken has no vocab for falls back to `approx`.
# Executed in the gate by `nix/checks/tokenizer-tiktoken.nix`.
tokenizer-tiktoken = ["tokenizer-approx", "dep:tiktoken-rs", "dep:rayon"]
# Exact counts from a local model's `tokenizer.json` (Qwen/GLM/Llama/…) via the
# HuggingFace `tokenizers` crate. Off by default; a model with no configured/loadable
# file falls back to `approx`. Executed in the gate by `nix/checks/tokenizer-hf.nix`.
tokenizer-hf = ["tokenizer-approx", "dep:tokenizers"]
# Counts via a provider's `messages/count_tokens` endpoint (Anthropic-style). Needs
# network + an API key at runtime; off by default and gate-tested against a loopback
# server (tests/provider_e2e.rs), never the real endpoint. See parity spec 23.
tokenizer-provider = ["tokenizer-approx", "dep:reqwest", "dep:serde_json"]
# Injects a dhat global allocator for the allocation-budget leak test only; never
# in a normal build. Mirrors the other crates' `dhat-heap` gate.
dhat-heap = ["dep:dhat"]

[dependencies]
agent-core.workspace = true
async-trait.workspace = true
tiktoken-rs = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing.workspace = true
dhat = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
rstest.workspace = true
serde_json.workspace = true
agent-testkit.workspace = true
iai-callgrind.workspace = true
tiny_http.workspace = true

# Guards the CPU hot path — `count_text` runs inside the compaction loop and per
# turn on the assembled prompt.
[[bench]]
name = "tokenize"
harness = false

[lints]
workspace = true
