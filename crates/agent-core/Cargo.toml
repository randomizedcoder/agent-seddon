[package]
name = "agent-core"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures-core.workspace = true
futures-util.workspace = true
# For the `AGENT_IDENTITY` task-local carrier (multi-session identity propagation);
# `task_local!` / `TaskLocalFuture` need no runtime feature.
tokio = { workspace = true }
# `repo_graph`: `node_id = sha256(node_key)[..8]` and the snapshot `graph_hash`
# (docs/design/repo-knowledge/01-schema.md, 02-extraction.md). Pinned workspace dep, no features.
sha2.workspace = true

[dev-dependencies]
rstest.workspace = true
iai-callgrind.workspace = true

# The loop calls `ToolRegistry::describe_all` once per turn to assemble the tool
# schemas; this guards that per-turn cost (sort + clone) against regression.
[[bench]]
name = "registry"
harness = false

[lints]
workspace = true
