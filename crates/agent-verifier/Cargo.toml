[package]
name = "agent-verifier"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Deterministic argument/schema check (no model). The reference verifier: it
# validates a tool call's arguments against the tool's JSON Schema and asks the
# model to Revise on a mismatch. Cheap, model-free, always-safe.
default = ["verifier-schema"]
verifier-schema = []
# Model-backed verifier: ask an `LlmProvider` to judge a tool call's correctness.
# Catches semantic slips a schema check can't, at the cost of a model call.
verifier-llm = []
# Ensemble verifier: run several member verifiers and combine their verdicts by a
# confidence-weighted vote (any Deny wins). Composes the other backends by config name.
verifier-ensemble = ["dep:futures-util"]

[dependencies]
agent-core.workspace = true
async-trait.workspace = true
serde_json.workspace = true
futures-util = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
rstest.workspace = true
agent-testkit.workspace = true

[lints]
workspace = true
