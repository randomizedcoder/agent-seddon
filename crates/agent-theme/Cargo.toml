[package]
name = "agent-theme"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The wire type (`pb::Theme`) + the emitted descriptor set drive the textproto
# parse and the proto3-JSON form the portal bundles.
agent-proto.workspace = true
# `safe_segment`, the audited id gate.
agent-core.workspace = true
prost.workspace = true
prost-reflect.workspace = true
serde_json.workspace = true
# User themes and preferences are cards (`ThemeBook`), on whichever backend
# `[themes] store` picks.
agent-config-store.workspace = true
# The preference card id is a hash of the subject.
sha2.workspace = true
# NFKD for the lookalike-name check (`skeleton`).
unicode-normalization.workspace = true

[dev-dependencies]
rstest.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
