[package]
name = "agent-forge"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["forge-github", "forge-gitlab"]
forge-github = []
forge-gitlab = []
# Gitea host (config C36 / D1b): opt-in — NOT in `default`, so the standard build
# is unchanged. A GitHub-shaped `/api/v1` with its own auth/merge/paging dialect.
forge-gitea = []
# Bitbucket Cloud host (config C36 / D1b): opt-in — the divergent API (body-envelope
# paging, no review object, deeply-nested fields, upper-case state vocabulary).
forge-bitbucket = []
# GitHub App installation-token minting (forge-auth F2) + the webhook HMAC verify
# primitive (F3): opt-in — NOT in `default`, because it pulls in `jsonwebtoken` (RS256
# over `ring`) for the App JWT and `ring::hmac` for the `X-Hub-Signature-256` check.
# Resolves a `ghapp:<installation_id>` credential by minting a short-lived token.
forge-ghapp = ["dep:jsonwebtoken", "dep:ring"]
# The persisted forge-card registry (config C36 / D1): the `ForgeRegistry` store
# over the shared `agent-config-store`.
forge-store = ["dep:agent-config-store", "dep:agent-proto", "dep:prost"]
# The postgres tier for the forge store (opt-in; exercised by `nix run .#integration`).
forge-store-postgres = ["forge-store", "agent-config-store/config-store-postgres"]

[dependencies]
agent-core.workspace = true
agent-retry.workspace = true
async-trait.workspace = true
reqwest.workspace = true
serde_json.workspace = true
agent-config-store = { workspace = true, optional = true }
agent-proto = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
# RS256 signing of the GitHub App JWT (forge-auth F2). Over `ring`, already in-tree;
# the RUSTSEC-banned `rsa` crate is deliberately NOT used.
jsonwebtoken = { workspace = true, optional = true }
# Constant-time HMAC-SHA256 for webhook signature verification (forge-auth F3), via
# `ring::hmac::verify`. Already in-tree (jsonwebtoken rides the same `ring`).
ring = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
rstest.workspace = true
tiny_http.workspace = true
# Format an HTTP-date Retry-After for the pacing table.
httpdate.workspace = true
# Reuse the embedded RSA test key + JWK (oidc module) to exercise the minter.
agent-testkit = { workspace = true, features = ["oidc"] }

[lints]
workspace = true
