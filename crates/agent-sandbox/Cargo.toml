[package]
name = "agent-sandbox"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The `local` (unconfined spawn) backend is always available — the default. The
# `nix` backend runs commands inside the repo's pinned flake closure. The `bwrap`
# backend (C23) adds real Tier-1 isolation via rootless namespaces; it is opt-in
# (Linux-only, needs the `bwrap` binary) and NOT in `default`. The `oci`/`microvm`
# (Tier 2+) backends + the nix sandboxed-derivation mode are follow-ups. See
# docs/components/sandbox.md and parity spec 14.
default = ["sandbox-local", "sandbox-nix"]
sandbox-local = []
sandbox-nix = []
# The bwrap backend pulls the pure-Rust seccomp compiler (with libc's arch-correct SYS_*
# numbers + the anonymous memfd the BPF is passed to bwrap over) for the C23-3b tuned
# syscall filter. It compiles ONLY under this opt-in feature.
sandbox-bwrap = ["dep:seccompiler"]
# Injects a dhat global allocator for the allocation-budget leak test only.
dhat-heap = ["dep:dhat"]

[dependencies]
agent-core.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
dhat = { workspace = true, optional = true }
# C23-3b seccomp filter — compiled only under `sandbox-bwrap` (see [features]).
seccompiler = { workspace = true, optional = true }
# `killpg`: a timed-out or cancelled command is killed with its whole process group
# (a `git fetch` leaves `git-remote-https` and `index-pack` running otherwise). Already
# in the tree through tokio, so no new crate.
libc = { workspace = true }

[dev-dependencies]
rstest.workspace = true
agent-testkit.workspace = true

[lints]
workspace = true
