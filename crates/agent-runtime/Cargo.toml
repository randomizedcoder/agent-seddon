[package]
name = "agent-runtime"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The batteries-included default. Grows as each milestone's modules land
# (provider-anthropic, tool-edit, tool-search are added in their milestones).
default = [
    "provider-openai-compat",
    "provider-anthropic",
    "tool-core",
    "tool-edit",
    "tool-patch",
    "tool-search",
    "tool-metrics",
    "search",
    "ast",
    "structural-search",
    "git",
    "context-sliding-window",
    "context-summarizing",
    "context-mode-aware",
    "context-instant",
    "tokenizer",
    "memory-file",
    "dimensions",
    "mcp",
    "grpc",
    "subagents",
    "web",
    "tasks",
    "structured",
    "lsp",
    "semantic-search",
    "session",
    "reference",
    "scanner",
    "verifier",
    "cache",
    "web-search",
    "provider-router",
    "provider-pool",
    "provider-consensus",
    "digest",
    "graph",
    "mode",
    "review",
    "prompt",
    "registry",
    "fleet",
    "role-store",
    "scheduler-store",
    "forge-registry-store",
    "transport-registry-store",
    "metrics-proxy",
    "session-export",
    "skill-write",
    "forge",
    "scheduler",
    "pty",
    "recall",
    "config",
]

# Each feature forwards to the owning impl crate + drives `register_builtins`.
provider-openai-compat = ["agent-providers/provider-openai-compat"]
provider-anthropic = ["agent-providers/provider-anthropic"]
# Router: composes N providers behind the LlmProvider trait. See parity spec 25.
provider-router = ["agent-providers/provider-router"]
# LlmPool: a health-checked, tiered pool with parallel fan-out (implies router).
# See docs/design/code-review/llm-pool.md.
provider-pool = ["provider-router", "agent-providers/provider-pool"]
# Consensus gate: generator × critic response gate. Resolves its members like
# route upstreams, so it implies `provider-router`.
# See docs/design/cognition-graph/01-consensus-gate.md.
provider-consensus = ["provider-router", "agent-providers/provider-consensus"]
# Digest ledger + background distiller (cognition-graph 02): both store backends
# link so `[digest] store` picks at runtime, matching the seam philosophy.
digest = [
    "dep:agent-digest",
    "agent-digest/digest-sqlite",
    "agent-digest/digest-clickhouse",
]
# Cognition-graph document (cognition-graph 04/05): the declarative node graph
# + node-type schema registry (`[graph] store`, `--serve-graph`), plus the fork
# executor — the builder composes branch chains from `provider-branching` and
# per-branch/post-merge gates from `provider-consensus`.
graph = [
    "dep:agent-graph",
    "provider-consensus",
    "agent-providers/provider-branching",
]
# General task-mode detection (the TaskClassifier seam), always-on. See
# docs/design/adaptive-cognition/01-mode.md.
mode = ["dep:agent-mode"]
# Code review flow: the ReviewCollector seam. Needs `git` for the RepoBackend the
# collector reads, and `mode` because the in-loop hand-off reads the current mode.
# See docs/design/code-review/.
review = ["dep:agent-review", "git", "mode"]
tool-core = ["agent-tools/tool-core"]
tool-edit = ["agent-tools/tool-edit"]
tool-patch = ["agent-tools/tool-patch"]
tool-search = ["agent-tools/tool-search"]
# The `metrics` tool: the agent can read its own live performance registry.
tool-metrics = ["agent-tools/tool-metrics"]
# High-performance code search seam: the tantivy backend + the `search` tool.
search = [
    "dep:agent-search",
    "agent-search/search-tantivy",
    "agent-tools/tool-search-index",
]
# Type-aware code-graph seam: the Go engine (via the `agent-go-graph` helper) + the
# `find_*` code-graph tools. See docs/components/ast.md.
ast = [
    "dep:agent-ast",
    "agent-ast/ast-go",
    "agent-tools/tool-ast-graph",
]
# The SCIP breadth engine for the code-graph seam: cross-language symbols /
# implementations via scip-go / rust-analyzer scip / scip-typescript / scip-python.
# Off by default (heavier deps + slower indexers); opt in + set `[ast] backends` and
# `[ast] scip_langs`.
ast-scip = ["ast", "agent-ast/ast-scip"]
# The `structural_search` tool (ast-grep, via the Sandbox) — multi-language AST-pattern
# search. Needs `ast-grep` on PATH at runtime. See docs/components/ast.md.
structural-search = ["agent-tools/tool-structural-search"]
# Semantic (embeddings) code search: the Embedder seam + the vector SearchBackend
# + hybrid RRF fusion. Requires `search`. See parity spec 15.
semantic-search = [
    "search",
    "dep:agent-embed",
    "agent-embed/embed-local",
    "agent-search/search-vector",
]
# Content-addressed session history (checkpoint/branch/undo/fork). See spec 19.
session = ["dep:agent-session", "agent-session/session-file"]
# `@file`/`@dir`/`@symbol`/`@url` prompt-reference expansion, routed through the
# Search + Web seams, injection-scanned + token-budgeted. See parity spec 17.
reference = ["dep:agent-reference", "agent-reference/reference-local"]
# Content security scanning: the Scanner seam feeding the Policy gate. See
# parity spec 18 and docs/components/scanner.md.
# Prompt-cache breakpoint placement. See parity spec 24 and
# docs/components/prompt-cache.md.
cache = ["dep:agent-cache", "agent-cache/cache-strategies"]
# Live web search: the WebSearch seam + the `web_search` tool. See parity spec 12.
# Session export: deterministic transcript render + redaction (parity spec 20).
session-export = ["agent-tools/tool-session-export"]
# Cross-session recall: a tantivy index over saved session transcripts (the
# `SessionCorpus` document source), reusing the `search` seam. See parity spec 20.
# The `session_recall` tool is added in the next increment.
recall = ["search", "dep:agent-export", "agent-tools/tool-session-recall"]
# Skill authoring: the agent writes a reusable SKILL.md (parity spec 30).
skill-write = ["agent-tools/tool-skill-write"]
# Forge: GitHub/GitLab PRs, issues, reviews. See parity spec 27.
# Scheduler: recurring unattended runs. See parity spec 28.
scheduler = ["dep:agent-scheduler", "agent-tools/tool-schedule"]
# The shared-store scheduler backend (config C41 / C2c): jobs persist onto
# `agent-config-store` as `(collection = "scheduler", tenant, id)` cards, so a
# `[scheduler] store` other than "" selects the durable `StoreScheduler` (the
# durable twin of `LocalScheduler`) and — with `[tenancy] per_tenant` — a
# tenant-fanning driver. On by default (like registry/fleet/role) so the file tier
# is available without a rebuild; the sqlite/postgres tiers stay opt-in below.
scheduler-store = ["scheduler", "agent-scheduler/scheduler-store", "dep:agent-config-store"]
# The `sqlite` arm of the shared-store scheduler (`[scheduler] store = "sqlite"`):
# adds the config-store SQLite backend. Hermetic (bundled SQLite), off by default.
scheduler-sqlite = ["scheduler-store", "agent-config-store/config-store-sqlite"]
# The `postgres` arm of the shared-store scheduler (`[scheduler] store =
# "postgres"`): builds `StoreScheduler` over a `PgBackend` from `[config_store]`.
# Off by default; NOT hermetic (needs a live Postgres server).
scheduler-postgres = [
  "scheduler-store",
  "agent-scheduler/scheduler-store-postgres",
  "agent-config-store/config-store-postgres",
]
# PTY: interactive terminal sessions. See parity spec 29.
pty = ["dep:agent-pty", "agent-tools/tool-pty"]
forge = ["dep:agent-forge", "agent-tools/tool-forge", "forge-github", "forge-gitlab"]
forge-github = ["agent-forge/forge-github"]
forge-gitlab = ["agent-forge/forge-gitlab"]
web-search = [
    "dep:agent-web-search",
    "agent-tools/tool-web-search",
    "websearch-brave",
    "websearch-searxng",
]
websearch-brave = ["agent-web-search/websearch-brave"]
websearch-searxng = ["agent-web-search/websearch-searxng"]
scanner = [
    "dep:agent-scanner",
    "agent-scanner/scanner-secret",
    "agent-scanner/scanner-threat",
]
verifier = [
    "dep:agent-verifier",
    "agent-verifier/verifier-schema",
    "agent-verifier/verifier-llm",
    "agent-verifier/verifier-ensemble",
]
# Multi-branch git seam: the RepoBackend backend (CLI by default) + the git tools.
git = [
    "dep:agent-git",
    "agent-git/git-cli",
    "agent-tools/tool-git",
]
context-sliding-window = ["agent-context/context-sliding-window"]
context-summarizing = ["agent-context/context-summarizing"]
context-mode-aware = ["agent-context/context-mode-aware", "context-summarizing"]
# Instant compaction (cognition-graph 03): assemble from the digest ledger. Needs
# the ledger, so it implies `digest`.
context-instant = [
    "agent-context/context-instant",
    "context-summarizing",
    "digest",
]
# Tokenizer + cost seam: the approx backend, price table, accurate compaction
# counts + USD/cache accounting (parity spec 23).
tokenizer = ["dep:agent-tokenizer", "agent-tokenizer/tokenizer-approx"]
# The real OpenAI-family BPE backend (`backend = "tiktoken"`), off by default so
# the standard build stays hermetic. Forwards to agent-tokenizer's own feature
# (mirrors `prompt-sqlite`→`agent-prompt/prompt-sqlite`). See parity spec 23.
tokenizer-tiktoken = ["tokenizer", "agent-tokenizer/tokenizer-tiktoken"]
# The HuggingFace `tokenizer.json` backend (`backend = "hf"`), for counting with a
# local model's exact tokenizer. Off by default. See parity spec 23.
tokenizer-hf = ["tokenizer", "agent-tokenizer/tokenizer-hf"]
# The provider count-tokens backend (`backend = "provider"`): counts via a
# provider's endpoint (network + key). Off by default. See parity spec 23.
tokenizer-provider = ["tokenizer", "agent-tokenizer/tokenizer-provider"]
memory-file = ["agent-memory/memory-file"]
dimensions = ["agent-memory/memory-dimensions"]
# Prompt management seam (docs/design/portal): see + CRUD every prompt.
prompt = ["dep:agent-prompt"]
# The `sqlite` PromptStore backend (docs/design/prompts/05-storage.md), off by
# default. Forwards to agent-prompt's own feature (mirrors `session`→`session-file`).
prompt-sqlite = ["prompt", "agent-prompt/prompt-sqlite"]
# The shared-store prompt backend (config C41 / A3c): the storable tiers persist
# onto `agent-config-store`; the FilePromptStore tree stays as-is. Off by default.
prompt-store = ["prompt", "agent-prompt/prompt-store", "dep:agent-config-store"]
# The Postgres arm of the shared-store prompt backend: adds the `postgres` arm to
# the prompt resolver, building `StorePrompt` over a `PgBackend` from `[config_store]`.
# Off by default; NOT hermetic (needs a live Postgres server).
prompt-postgres = [
  "prompt-store",
  "agent-prompt/prompt-store-postgres",
  "agent-config-store/config-store-postgres",
]
# Provider-registry seam (model-router 03): the ProviderRegistry stores + the
# `--model-router-config` textproto startup loader.
registry = ["dep:agent-registry"]
# The `sqlite` registry backend, off by default (mirrors `prompt-sqlite`).
registry-sqlite = ["registry", "agent-registry/registry-sqlite"]
# The shared-store registry backend (config C41 / A3): the registry persists onto
# `agent-config-store` (memory/file/sqlite). Off by default.
registry-store = ["registry", "agent-registry/registry-store", "dep:agent-config-store"]
# The Postgres arm of the shared-store registry backend: adds the `postgres` arm
# to `resolve_provider_registry`, building `StoreRegistry` over a `PgBackend` from
# `[config_store]`. Off by default; NOT hermetic (needs a live Postgres server).
registry-postgres = [
  "registry-store",
  "agent-registry/registry-store-postgres",
  "agent-config-store/config-store-postgres",
]
# Review-fleet roster seam (review-fleet C2/C3): the FleetRegistry stores + the
# `resolve_fleet_registry` factory (`[review_fleet] store`, `--serve-fleet`).
fleet = ["dep:agent-review-fleet"]
# The `sqlite` fleet backend, off by default (mirrors `registry-sqlite`).
fleet-sqlite = ["fleet", "agent-review-fleet/fleet-sqlite"]
# The shared-store fleet backend (config C41 / A3b): the roster persists onto
# `agent-config-store` (memory/file/sqlite). Off by default.
fleet-store = ["fleet", "agent-review-fleet/fleet-store", "dep:agent-config-store"]
# The Postgres arm of the shared-store fleet backend: adds the `postgres` arm to
# `resolve_fleet_registry`, building `StoreFleet` over a `PgBackend` from
# `[config_store]`. Off by default; NOT hermetic (needs a live Postgres server).
fleet-postgres = [
  "fleet-store",
  "agent-review-fleet/fleet-store-postgres",
  "agent-config-store/config-store-postgres",
]
# RBAC role-card seam (config C1b): the shared-store `RoleRegistry` (`StoreRoles`)
# + the `resolve_role_registry` factory (`[role] store`, `--serve-role`). Persists
# operator-defined role cards onto `agent-config-store` (file/postgres) as prost
# blobs, atop the three immutable built-ins. On by default (like registry/fleet).
role-store = ["dep:agent-role", "agent-role/role-store", "dep:agent-config-store"]
# The Postgres arm of the role store: adds the `postgres` arm to
# `resolve_role_registry`, building `StoreRoles` over a `PgBackend` from
# `[config_store]`. Off by default; NOT hermetic (needs a live Postgres server).
role-postgres = [
  "role-store",
  "agent-role/role-store-postgres",
  "agent-config-store/config-store-postgres",
]
# Forge-card registry (config C36 / D1): persist git-host cards onto
# `agent-config-store` (file/postgres) via `StoreForges` in `agent-forge`, held for
# `--serve-forge-registry`. On by default. Independent of the `forge` *seam* — it
# needs only the forge store, not a built-in host impl.
forge-registry-store = [
  "dep:agent-forge",
  "agent-forge/forge-store",
  "dep:agent-config-store",
]
# The Postgres arm of the forge registry. Off by default; NOT hermetic (needs a
# live Postgres server).
forge-registry-postgres = [
  "forge-registry-store",
  "agent-forge/forge-store-postgres",
  "agent-config-store/config-store-postgres",
]
# Transport-card registry (config C37 / D2): persist messaging cards onto
# `agent-config-store` (file/postgres) via `StoreTransports` in `agent-slack`, held
# for `--serve-transport-registry`. On by default. Independent of any live watch — it
# needs only the transport store.
transport-registry-store = [
  "dep:agent-slack",
  "agent-slack/transport-store",
  "dep:agent-config-store",
]
# The Postgres arm of the transport registry. Off by default; NOT hermetic (needs a
# live Postgres server).
transport-registry-postgres = [
  "transport-registry-store",
  "agent-slack/transport-store-postgres",
  "agent-config-store/config-store-postgres",
]
# Metrics proxy seam (docs/design/portal): generic PromQL-over-gRPC to Prometheus.
metrics-proxy = ["dep:agent-metrics-proxy", "agent-metrics-proxy/http"]
# Connect to external MCP servers and register their tools.
mcp = ["dep:agent-mcp"]
# gRPC seam transports: `= "grpc"` client factories + remote tool workers.
grpc = ["dep:agent-grpc"]
# OIDC/JWT bearer authentication for served seams (config C33/B1). Off by default so
# the standard binary ships no token verification; enabling it lets `[auth] mode =
# "oidc"` build the JWKS/JWT verifier (else it is a fail-closed startup error).
auth = ["grpc", "agent-grpc/auth"]
# Expose a `delegate` tool that spawns child agents (isolated context).
subagents = []
# The `web_fetch` tool over the WebBackend seam: the local reqwest transport +
# the tool + the SSRF guard wiring. See parity spec 11.
web = ["dep:agent-web", "agent-web/web-local", "agent-tools/tool-web"]
# The `todo_write` tool over the TaskTracker seam: the in-memory tracker + the
# tool + plan-progress metrics. See parity spec 21.
tasks = ["dep:agent-tasks", "agent-tasks/tasks-memory", "agent-tools/tool-todo"]
# Structured output: the OutputSchema validator seam + the bounded repair loop.
# See parity spec 16.
structured = ["dep:agent-validate", "agent-validate/validate-draft07"]
# The `lsp` tool over the LspBackend seam: the LSP manager (real stdio servers) +
# the tool + diagnostics/navigation metrics. Off unless `[lsp] servers` is set.
# See parity spec 13.
lsp = ["dep:agent-lsp", "agent-lsp/lsp-stdio", "agent-tools/tool-lsp"]
# Config schema generation (portal settings): adds `Serialize` +
# `schemars::JsonSchema` derives to every config struct so the config schema and
# effective values can be emitted. Off by default so a minimal build stays lean.
config-schema = ["dep:schemars"]
# The ConfigStore seam (portal settings): the file-backed `FileConfigStore` that
# serves the schema/values and writes edits back to `config/agent.toml` in place
# (via toml_edit), hosted over gRPC (`agent --serve-config` / `--serve-all`).
config = ["config-schema", "dep:toml_edit"]

[dependencies]
agent-core.workspace = true
agent-metrics.workspace = true
# These default to no features (see workspace deps); features below opt in.
agent-providers.workspace = true
agent-tools.workspace = true
agent-search = { workspace = true, optional = true }
agent-ast = { workspace = true, optional = true }
# Redaction reuse for the cross-session recall corpus (spec 20).
agent-export = { workspace = true, optional = true }
agent-git = { workspace = true, optional = true }
agent-memory.workspace = true
agent-context.workspace = true
agent-prompt = { workspace = true, optional = true }
agent-registry = { workspace = true, optional = true }
agent-review-fleet = { workspace = true, optional = true }
agent-role = { workspace = true, optional = true }
# The shared transactional config store (config C41). Optional: pulled in only by
# the `registry-store`/`registry-postgres` features (and later A3b/A3c).
agent-config-store = { workspace = true, optional = true }
agent-digest = { workspace = true, optional = true }
agent-graph = { workspace = true, optional = true }
agent-metrics-proxy = { workspace = true, optional = true }
agent-tokenizer = { workspace = true, optional = true }
agent-web = { workspace = true, optional = true }
agent-tasks = { workspace = true, optional = true }
agent-embed = { workspace = true, optional = true }
agent-session = { workspace = true, optional = true }
agent-reference = { workspace = true, optional = true }
agent-scanner = { workspace = true, optional = true }
agent-verifier = { workspace = true, optional = true }
agent-cache = { workspace = true, optional = true }
agent-web-search = { workspace = true, optional = true }
agent-forge = { workspace = true, optional = true }
agent-slack = { workspace = true, optional = true }
agent-mode = { workspace = true, optional = true }
agent-review = { workspace = true, optional = true }
agent-scheduler = { workspace = true, optional = true }
agent-pty = { workspace = true, optional = true }
agent-validate = { workspace = true, optional = true }
agent-lsp = { workspace = true, optional = true }
# bash (tool-core) routes through the Sandbox seam; the local + nix backends ship
# unconditionally (the seam is always available). See parity spec 14.
agent-sandbox = { workspace = true, features = ["sandbox-local", "sandbox-nix"] }
agent-mcp = { workspace = true, optional = true }
agent-grpc = { workspace = true, optional = true }
agent-telemetry.workspace = true
async-trait.workspace = true
futures-util.workspace = true
async-stream.workspace = true
# Server-minted session ids for the SessionRegistry seam (05-lifecycle).
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# JSON-Schema derive for the config structs, gated by `config-schema`.
schemars = { workspace = true, optional = true }
# Comment-preserving TOML write-back for the ConfigStore seam, gated by `config`.
toml_edit = { workspace = true, optional = true }
serde_ignored.workspace = true
tokio.workspace = true
# `BroadcastStream` wraps the session-event broadcast receiver as a Stream
# (docs/design/portal, agent-session observation).
tokio-stream.workspace = true
tracing.workspace = true
anyhow.workspace = true
# Robust URL host/scheme extraction for the SSRF guard (parity spec 11).
url.workspace = true

[dev-dependencies]
agent-testkit.workspace = true
rstest.workspace = true
# The distiller tests drive a real (in-memory) ledger.
agent-digest = { workspace = true, features = ["digest-sqlite"] }

[lints]
workspace = true
