[package]
name = "agent-k8s-secrets"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

# The `nix run .#k8s-secrets` deploy tool. The crate is a lib (the pure, testable
# core: manifest parse + fail-closed source validation + Secret build + redaction)
# plus a thin binary that pipes the built Secrets into `kubectl apply`.
[lib]

[[bin]]
name = "k8s-secrets"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
toml = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rstest.workspace = true
agent-testkit.workspace = true

[lints]
workspace = true
