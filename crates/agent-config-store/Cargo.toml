[package]
name = "agent-config-store"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The `sqlite` config-store backend — cards as opaque blobs in embedded SQLite,
# off by default so a normal build stays dependency-free (mirrors
# agent-registry's `registry-sqlite`). The DB is compiled in (`rusqlite`
# `bundled`), so this tier is hermetic in `nix flake check`.
config-store-sqlite = ["dep:rusqlite"]

[dependencies]
# The shared error/result vocabulary + the audited `safe_segment` id gate. The
# store binds to no domain types — cards are opaque blobs keyed by
# (collection, tenant, id), so registry/fleet/prompt can converge onto it later
# (increments A3*) with no behaviour change.
agent-core.workspace = true
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
agent-testkit.workspace = true
tokio.workspace = true

[lints]
workspace = true
