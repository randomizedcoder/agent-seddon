[package]
name = "agent-config-store"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The `sqlite` config-store backend — cards as opaque blobs in embedded SQLite,
# off by default so a normal build stays dependency-free (mirrors
# agent-registry's `registry-sqlite`). The DB is compiled in (`rusqlite`
# `bundled`), so this tier is hermetic in `nix flake check`.
config-store-sqlite = ["dep:rusqlite"]
# The `postgres` config-store backend — the same opaque-blob cards over a real
# Postgres server via `sqlx`, off by default so a normal build stays DB-free.
# Unlike sqlite this tier is NOT hermetic (it needs a live server), so its tests
# are `#[ignore]`-gated and run only under `nix run .#integration`; the crate
# still compiles under this feature with no DB (runtime-checked queries).
#
# Deliberately NO `sqlx/migrate` or `sqlx/macros`: sqlx's `macros` feature pulls
# in *every* driver crate (`sqlx-mysql`, `sqlx-sqlite`) regardless of the driver
# we actually use, and `sqlx-mysql` drags in `rsa` — a crate with an unfixable
# timing-sidechannel advisory (RUSTSEC-2023-0071) that `cargo audit` rejects. We
# never speak MySQL, so we run our own tiny versioned migration runner over the
# embedded `migrations/` set (see `postgres.rs`) instead of the `migrate!` macro.
config-store-postgres = ["dep:sqlx"]

[dependencies]
# The shared error/result vocabulary + the audited `safe_segment` id gate. The
# store binds to no domain types — cards are opaque blobs keyed by
# (collection, tenant, id), so registry/fleet/prompt can converge onto it later
# (increments A3*) with no behaviour change.
agent-core.workspace = true
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
rusqlite = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
agent-testkit.workspace = true
tokio.workspace = true

[lints]
workspace = true
