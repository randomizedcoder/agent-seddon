[package]
name = "agent-testkit"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared test doubles for the agent-seddon seams (dev use only)."

[dependencies]
agent-core.workspace = true
agent-mcp.workspace = true
# `observe::MetricsProbe` reads a running `Metrics` registry (public text
# exposition only). Leaf dep — no cycle (agent-metrics only pulls `prometheus`).
agent-metrics.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
# `observe::captured_spans` installs a span-capturing subscriber for a closure.
tracing.workspace = true
tracing-subscriber.workspace = true

# `oidc::FakeIssuer` (security-hardening S3): a loopback OIDC issuer (discovery +
# JWKS) and fixed signing keys for auth tests.
jsonwebtoken = { workspace = true, optional = true }
tiny_http = { workspace = true, optional = true }
# The fake issuer's authorization-code flow (S13): form decoding, and the PKCE
# S256 check a real IdP makes.
url = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# `pki::TestPki` (security-hardening S4): throwaway CAs and leaf certificates
# for the gRPC TLS / mTLS matrix, generated at test time.
rcgen = { workspace = true, optional = true }

[features]
oidc = ["dep:jsonwebtoken", "dep:tiny_http", "dep:url", "dep:ring", "dep:base64"]
pki = ["dep:rcgen"]

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true
