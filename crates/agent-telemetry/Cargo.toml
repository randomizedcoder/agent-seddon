[package]
name = "agent-telemetry"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agent-core.workspace = true
# Redact secrets out of message content before it is stored in ClickHouse
# (multi-tenancy C28-3): the recall path reads `agent_events.content`, so a leaked
# credential must never land in the table in the first place (parity with the
# tantivy recall corpus, which redacts before indexing).
agent-export.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
klickhouse.workspace = true

# OTLP trace export to the ClickStack OTEL collector, layered onto `tracing`
# alongside the ClickHouse-native sink above.
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
# For attaching OTLP request headers (e.g. the HyperDX ingestion key) as gRPC metadata.
tonic.workspace = true

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true
