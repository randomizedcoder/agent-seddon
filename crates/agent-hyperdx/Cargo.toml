[package]
name = "agent-hyperdx"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

# `hyperdx-provision`: writes the agent-seddon HyperDX dashboards and saved searches
# (nix/hyperdx/dashboards.nix) through HyperDX's own API, which validates each write.
# The lib is the pure, testable core (source placeholders, the create/update/skip plan,
# fail-closed parsing of the API's replies); the binary is a thin HTTP client.
[lib]

[[bin]]
name = "hyperdx-provision"
path = "src/main.rs"

[dependencies]
agent-retry.workspace = true
async-trait.workspace = true
reqwest.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true
