[package]
name = "agent-context"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["context-sliding-window"]
# Non-destructive sliding-window truncation.
context-sliding-window = []
# LLM-summarizing compaction (keeps head + recent tail, summarizes the middle).
context-summarizing = []
# Mode-aware compaction: reshape context through the destination mode's lens on a
# task-mode switch (adaptive-cognition 02). Wraps the summarizer.
context-mode-aware = ["context-summarizing"]
# Instant compaction (cognition-graph 03): assemble from the pre-computed digest
# ledger instead of summarizing on the critical path. Wraps the summarizer as its
# fail-soft fallback.
context-instant = ["context-summarizing", "dep:serde_json"]
# dhat-instrumented leak/allocation tests (tests/leak.rs).
dhat-heap = ["dep:dhat"]

[dependencies]
agent-core.workspace = true
async-trait.workspace = true
tracing.workspace = true
serde_json = { workspace = true, optional = true }
dhat = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
rstest.workspace = true
serde_json.workspace = true
agent-testkit.workspace = true
iai-callgrind.workspace = true
# The instant-compaction tests run against a real (in-memory) ledger populated
# with the deterministic corpus.
agent-digest = { workspace = true, features = ["digest-sqlite"] }

# Guards instant compaction's assembly path (the point of increment 03 is that
# this path is cheap; the ceiling keeps it so).
[[bench]]
name = "instant_assemble"
harness = false
required-features = ["context-instant"]

# Guards `estimate_tokens` — called in the compaction loop.
[[bench]]
name = "context"
harness = false

# Guards the switch-compaction partition (which turn goes where) — its hot path.
[[bench]]
name = "mode_aware"
harness = false
required-features = ["context-mode-aware"]

[[test]]
name = "leak"
harness = true
required-features = ["dhat-heap", "context-mode-aware"]

[lints]
workspace = true
