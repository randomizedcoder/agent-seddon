[package]
name = "agent-metrics"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

# The shared Prometheus registry + metric handles. This is a leaf crate (only
# depends on `prometheus`) so every seam impl crate can hold a `Metrics` and
# record its own timings/counts, without depending on `agent-runtime`.

[dependencies]
prometheus.workspace = true
# For `safe_segment` — the config-plane recorders re-validate their attacker-influenced
# `tenant`/`collection` labels at the funnel (defense in depth), so a hostile segment
# never reaches a Prometheus label. `agent-core` is the foundational crate every other
# crate already builds, so this adds no new crate to the graph.
agent-core = { workspace = true }
# Optional heap profiler — pulled in only by the `dhat-heap` feature for the leak
# test (tests/leak.rs). Absent from every normal build.
dhat = { workspace = true, optional = true }

[features]
# Installs dhat's global allocator so tests/leak.rs can assert no leak + an
# allocation budget. Off by default; the leak check runs `--features dhat-heap`.
dhat-heap = ["dep:dhat"]

[dev-dependencies]
# Deterministic instruction-count benchmark harness (see benches/metrics.rs).
iai-callgrind.workspace = true
# Table-driven unit tests (four case classes + adversarial), per CLAUDE.md.
rstest.workspace = true
# Drives `agent_core::scope(...)` in the Phase-5 tests, so the ambient-tenant
# recorders can be exercised under a scoped identity (current-thread runtime only).
tokio = { workspace = true }

# The exemplar bench + leak test establish the pattern every feature PR follows.
[[bench]]
name = "metrics"
harness = false

[lints]
workspace = true
