[package]
name = "agent-campaign"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

# Campaigns (docs/design/campaigns): the pure rules and the `CampaignStore` seam live
# in `agent_core::campaign`; this crate holds what only a consumer needs (display
# letters, the planner) and the Postgres tier behind `campaign-postgres`.

[features]
# Postgres tier — `PgCampaigns`, every protocol (a)–(g) as one transaction over a
# real server via `sqlx` (pure-Rust rustls, no libpq), off by default so a normal
# build stays DB-free. NOT hermetic (it needs a live server): its tests are
# `#[ignore]`-gated and run only under `nix run .#pg-integration`; the crate still
# compiles under this feature with no DB (runtime-checked queries, no `query!`).
# Deliberately NO `sqlx/migrate` / `sqlx/macros` — they pull in `sqlx-mysql` →
# `rsa` (RUSTSEC-2023-0071, rejected by cargo-audit); the in-crate versioned runner
# over the embedded `migrations/` set stands in (see `postgres.rs`).
campaign-postgres = ["dep:sqlx"]

[dependencies]
agent-core.workspace = true
# The planner (`planner/`) is always built: it asks a `LlmProvider` for one
# structured decision per node and validates it fail-closed against the seam's
# caps. `agent-validate` is the Draft-07 `OutputSchema` behind `Planner::draft07`
# (the workspace entry turns its default feature off, so it is named here);
# `sha2` mints `prompt_hash` / `idem_key`; `uuid` mints the random fence tags
# model text cannot close.
agent-validate = { workspace = true, features = ["validate-draft07"] }
async-trait.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
agent-testkit.workspace = true
rstest.workspace = true
tokio = { workspace = true }

[lints]
workspace = true
