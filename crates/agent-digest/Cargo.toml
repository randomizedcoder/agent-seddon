[package]
name = "agent-digest"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
# SQLite ledger — server-less environments (dev shells, CI, hermetic tests).
digest-sqlite = ["dep:rusqlite"]
# ClickHouse ledger (the default deployment target) — native protocol, durable
# async_insert writes, reuses the pinned klickhouse the telemetry writer uses.
digest-clickhouse = ["dep:klickhouse", "dep:tokio"]
# Postgres ledger — the same per-session contract over a real server via `sqlx`
# (pure-Rust rustls, no libpq), off by default so a normal build stays DB-free.
# Unlike sqlite this tier is NOT hermetic (it needs a live server), so its tests
# are `#[ignore]`-gated and run only under `nix run .#integration`; the crate
# still compiles under this feature with no DB (runtime-checked queries).
# Deliberately NO `sqlx/migrate`/`sqlx/macros` — they pull in `sqlx-mysql` →
# `rsa` (RUSTSEC-2023-0071, rejected by cargo-audit); a tiny in-crate versioned
# runner over the embedded `migrations/` set stands in (see `postgres.rs`).
digest-postgres = ["dep:sqlx"]
# dhat-instrumented leak/allocation tests (tests/leak.rs).
dhat-heap = ["dep:dhat"]

[dependencies]
agent-core.workspace = true
async-trait.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true, optional = true }
klickhouse = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
dhat = { workspace = true, optional = true }

[dev-dependencies]
agent-testkit.workspace = true
rstest.workspace = true
tokio = { workspace = true }
iai-callgrind.workspace = true

# Guards the ledger read path (fetch → decode → keyword filter → cap) over the
# deterministic testdata corpus; sqlite in-memory is the ephemeral harness.
[[bench]]
name = "digest_query"
harness = false
required-features = ["digest-sqlite"]

[[test]]
name = "leak"
harness = true
required-features = ["dhat-heap", "digest-sqlite"]
