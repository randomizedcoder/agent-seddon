[package]
name = "agent-slack"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The Matrix outbound transport (config C37 / D2b): a second `MessageTransport` impl
# behind an opt-in feature (off in the default build, which stays Slack-only). Needs
# no extra deps — reqwest/url/serde_json/async-trait are already present.
transport-matrix = []
# The persisted transport-card registry (config C37 / D2): the `TransportRegistry`
# store over the shared `agent-config-store`.
transport-store = ["dep:agent-config-store", "dep:agent-proto", "dep:prost"]
# The postgres tier for the transport store (opt-in; exercised by `nix run .#integration`).
transport-store-postgres = [
  "transport-store",
  "agent-config-store/config-store-postgres",
]

[dependencies]
# FleetTrigger + TriggerSink (the orchestrator's intake) that the watch emits onto.
agent-core.workspace = true
# Structural URL parsing (host/path) for the strict PR-link parser — never hand-rolled
# string ops, which is where lookalike-host bugs live. Already in-tree via reqwest.
url.workspace = true
# Locating URL candidates in untrusted free-form Slack text.
regex.workspace = true
# The async SlackTransport seam + the real Socket-Mode adapter.
async-trait.workspace = true
tracing.workspace = true
# Socket-Mode transport (inc 4b-transport): the outbound WebSocket. rustls only (no
# native-tls / openssl), matching the workspace TLS backend; `connect` pulls the client.
tokio-tungstenite = { version = "0.24", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
# apps.connections.open (exchange the app token for a wss URL) + envelope JSON parsing.
reqwest.workspace = true
serde_json.workspace = true
# Stream/Sink combinators for the WebSocket (read frames, send acks).
futures-util.workspace = true
# Runtime types for the connection.
tokio = { workspace = true }
# Reconnect/backoff — one retry library, never hand-rolled.
agent-retry.workspace = true
# The persisted transport-card registry (config C37 / D2), behind `transport-store`.
agent-config-store = { workspace = true, optional = true }
agent-proto = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true
tokio = { workspace = true }

[lints]
workspace = true
