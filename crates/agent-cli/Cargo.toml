[package]
name = "agent-cli"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agent"
path = "src/main.rs"

[features]
# The shipped `agent` binary is Postgres-capable by default (config C41 / PG-03,
# decision D1 Option B): `default` turns on the `postgres` umbrella so an operator
# can run the whole OLTP surface on one Postgres via `config/multi-tenant.toml`
# with no rebuild. The compiled config default stays `""` (D2), so the zero-server
# quickstart (`config/local-ollama.toml`, a `file` store) opens no DB. Build with
# `--no-default-features` (plus the features you want) for a lean, sqlx-free binary.
default = ["postgres"]
# The Postgres umbrella: forwards to agent-runtime's `postgres` feature (the seven
# `*-postgres` shared-store arms). Kept as a named feature (not inlined into
# `default`) so `--no-default-features --features postgres` is expressible.
postgres = ["agent-runtime/postgres"]
# OIDC/JWT bearer authentication for served seams (config C33/B1); forwards to
# agent-runtime/auth (→ agent-grpc/auth). Off by default — `[auth] mode = "oidc"`
# needs the agent built with this feature, else it is a fail-closed startup error.
auth = ["agent-runtime/auth"]

[dependencies]
agent-core.workspace = true
agent-runtime.workspace = true
# C23-3c agent-process egress allow-list — the loopback CONNECT filtering proxy.
agent-egress.workspace = true
# Grounded-fact rendering for `agent --review` (docs/design/code-review/).
agent-review.workspace = true
agent-grpc.workspace = true
# The review-fleet roster + orchestrator (C1/C8), for `agent --serve-fleet`.
agent-review-fleet.workspace = true
# Overlap-guarded `every {poll_secs}` jobs behind the forge-poll trigger (C6, inc 4a).
agent-scheduler.workspace = true
# The Slack-watch trigger source (C7): PR-link parser, fan-out, Socket-Mode transport.
agent-slack.workspace = true
agent-telemetry.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tiny_http.workspace = true
reqwest.workspace = true
rustyline.workspace = true

[dev-dependencies]
# For the out-of-tree extension example (examples/custom_provider.rs).
agent-core.workspace = true
async-trait.workspace = true
# For the MCP client↔server round-trip integration test.
agent-mcp.workspace = true
# Table-driven tests (the seam table's completeness + flag parsing).
rstest.workspace = true

# Pty-driven CLI tests (tests/repl_pty.rs). Unix-only: it spawns the binary on a
# real terminal to reach the REPL's line editor and the policy guard's operator
# prompt, neither of which a pipe can exercise.
[target.'cfg(unix)'.dev-dependencies]
rexpect.workspace = true

[lints]
workspace = true
