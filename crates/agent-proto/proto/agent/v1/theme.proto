// The portal's look as data (docs/design/visual/): palettes, type, shape,
// density and accessibility settings — tokens only, never CSS, URLs or code.
//
// A theme is authored by a user and rendered in other users' sessions, so every
// field is untrusted: the server (`agent-theme::validate`) and the portal mapper
// both check colours are strict hex, fonts are bundled families, numbers are in
// range, and text meets the declared WCAG contrast level — fail closed.
// `ThemeService` stores user themes and each user's active theme
// (docs/design/visual/03, 04).
syntax = "proto3";

package agent.v1;

// REST transcoding (docs/design/rest-openapi/): Envoy exposes the service as JSON.
import "google/api/annotations.proto";

// One portal look. Built-ins ship as `config/themes/<id>.textproto`.
message Theme {
  string id = 1; // safe_segment, ≤ 64 chars; the card key
  string name = 2; // display name, ≤ 64 chars, printable
  string description = 3; // ≤ 512 chars
  string author = 4; // credit, ≤ 64 chars
  bool builtin = 5; // server-set: compiled in, no stored override
  uint64 version = 6; // server-set: monotonic per (tenant, id)
  Palette light = 7; // at least one of light/dark is required
  Palette dark = 8;
  Typography typography = 9;
  Shape shape = 10;
  Density density = 11;
  Accessibility accessibility = 12;
  Visibility visibility = 13; // user themes only
  string owner = 14; // server-set from the caller; never trusted from the client
}

// Colours are "#RRGGBB" or "#RRGGBBAA". Unset roles derive from `seed` (Material 3
// tonal palette); with no seed every role is required.
message Palette {
  string seed = 1;
  string primary = 2;
  string on_primary = 3;
  string secondary = 4;
  string on_secondary = 5;
  string surface = 6; // cards, panes
  string on_surface = 7; // body text
  string background = 8; // scaffold
  string surface_variant = 9; // nav rail, headers
  string on_surface_variant = 10;
  string outline = 11; // borders, dividers
  string error = 12;
  string on_error = 13;
  string focus = 14; // focus ring
  SemanticColors semantic = 15;
}

// The colours the portal used to hardcode, named by meaning.
message SemanticColors {
  string success = 1;
  string warning = 2;
  string info = 3;
  string muted = 4;
  string code_background = 5;
  string code_foreground = 6;
  map<string, string> nav_tint = 7; // key: nav tab id; allowlisted
  map<string, string> graph_edge = 8; // key: edge kind; allowlisted
}

// Font families must be bundled with the portal (no remote fonts).
message Typography {
  string body_family = 1;
  string heading_family = 2; // default: body_family
  string mono_family = 3; // code, diffs, logs
  double scale = 4; // 0.75–1.5; 0 = 1.0
  uint32 body_weight = 5; // 100–900, step 100; 0 = 400
  uint32 heading_weight = 6; // 0 = 600
  double letter_spacing = 7; // -1.0–2.0 logical px
}

// Corners, borders, shadows.
message Shape {
  uint32 corner_radius = 1; // 0–32
  uint32 border_width = 2; // 0–4
  bool elevation = 3; // shadows on cards and menus
}

// Spacing between and inside controls.
enum Density {
  DENSITY_UNSPECIFIED = 0; // the platform's Material default
  DENSITY_COMPACT = 1;
  DENSITY_STANDARD = 2;
  DENSITY_COMFORTABLE = 3;
}

// What the theme promises for accessibility; the validator enforces `contrast`.
message Accessibility {
  ContrastLevel contrast = 1;
  uint32 focus_ring_width = 2; // 1–6 px; 0 = 2
  uint32 min_target_size = 3; // 40–64 px; 0 = 40
  bool reduce_motion = 4; // no page transitions or animations
  bool status_icons = 5; // always pair status colours with an icon + label
}

// The WCAG 2.2 contrast level text pairs must meet.
enum ContrastLevel {
  CONTRAST_LEVEL_UNSPECIFIED = 0; // = AA
  CONTRAST_LEVEL_AA = 1; // 4.5:1 text, 3:1 UI
  CONTRAST_LEVEL_AAA = 2; // 7:1 text, 4.5:1 UI
}

// Who sees a user theme.
enum Visibility {
  VISIBILITY_UNSPECIFIED = 0; // = PRIVATE
  VISIBILITY_PRIVATE = 1; // the owner only
  VISIBILITY_TENANT = 2; // everyone in the tenant (needs approve:theme)
}

// User themes and the caller's active theme (docs/design/visual/03, 04), gated by
// `(read|write|delete|approve, theme)`. A theme the caller may not see is reported
// as missing, never as forbidden.
service ThemeService {
  // Built-ins, the tenant's shared themes and the caller's own private ones.
  rpc List(ListThemesRequest) returns (ListThemesResponse) {
    option (google.api.http) = {get: "/v1/themes"};
  }
  rpc Get(GetThemeRequest) returns (Theme) {
    option (google.api.http) = {get: "/v1/themes/{id}"};
  }
  // Create or update a user theme; returns it as stored. `version` must equal the
  // stored version (0 to create), else ABORTED. Built-in ids are refused.
  rpc Put(Theme) returns (Theme) {
    option (google.api.http) = {
      put: "/v1/themes/{id}"
      body: "*"
    };
  }
  rpc Delete(DeleteThemeRequest) returns (DeleteThemeResponse) {
    option (google.api.http) = {delete: "/v1/themes/{id}"};
  }
  // The caller's theme, resolved: their pick, else the server default, else
  // `prototype`.
  rpc GetActive(GetActiveThemeRequest) returns (ActiveTheme) {
    option (google.api.http) = {get: "/v1/active-theme"};
  }
  rpc SetActive(SetActiveThemeRequest) returns (ActiveTheme) {
    option (google.api.http) = {
      put: "/v1/active-theme"
      body: "*"
    };
  }
}

message ListThemesRequest {}

message ListThemesResponse {
  repeated Theme themes = 1;
}

message GetThemeRequest {
  string id = 1;
}

message DeleteThemeRequest {
  string id = 1;
}

message DeleteThemeResponse {
  // Always false until operators can override a built-in.
  bool restored_builtin = 1;
}

// Light, dark or follow the browser.
enum ThemeMode {
  THEME_MODE_UNSPECIFIED = 0; // = SYSTEM
  THEME_MODE_SYSTEM = 1;
  THEME_MODE_LIGHT = 2;
  THEME_MODE_DARK = 3;
}

// Which step of the fallback chain answered GetActive.
enum ActiveSource {
  ACTIVE_SOURCE_UNSPECIFIED = 0;
  ACTIVE_SOURCE_USER = 1; // the caller's own pick
  ACTIVE_SOURCE_SERVER_DEFAULT = 2; // no pick, or the picked theme is gone
  ACTIVE_SOURCE_BUILTIN = 3; // the server default is missing too: `prototype`
}

message ActiveTheme {
  Theme theme = 1; // the resolved document, so the portal needs one round trip
  ThemeMode mode = 2;
  ActiveSource source = 3;
}

message GetActiveThemeRequest {}

message SetActiveThemeRequest {
  string theme_id = 1;
  ThemeMode mode = 2;
}

// A user's stored preference (collection `user_prefs`), keyed by a hash of the
// verified subject inside the caller's tenant. Never sent by a client.
message UserPrefs {
  string id = 1;
  string theme_id = 2;
  ThemeMode mode = 3;
  // Server-maintained: the ids of the user's private themes, updated in the same
  // write as each private theme, so the per-owner cap needs no scan.
  repeated string private_theme_ids = 4;
}
