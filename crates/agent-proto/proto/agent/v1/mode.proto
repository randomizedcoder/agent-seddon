// The `TaskClassifier` seam over gRPC: classify an incoming turn's task mode.
// General, always-on detection (docs/design/adaptive-cognition/01-mode.md) — the
// switch decision itself is runtime state, so only `Classify` is served here.
syntax = "proto3";

package agent.v1;

import "agent/v1/common.proto";
// REST transcoding annotations (gap-analysis §4, docs/design/rest-openapi/). The
// `(google.api.http)` options below let Envoy's `grpc_json_transcoder` expose the
// service as REST/JSON without any Rust code; gRPC stays the primary interface.
import "google/api/annotations.proto";

// `TaskMode` moved to common.proto (same package, wire/JSON-identical) so
// `RouteHint` can carry it without an import cycle (model-router 02b).

// What a classifier saw the incoming work as. `confidence` is untrusted (a pool
// vote's self-report) — clamp to 0..=1 on receipt.
message ModeVerdict {
  TaskMode mode = 1;
  float confidence = 2;
  string reason = 3;
}

// A decided change of task mode (recorded; drives compaction + memory later).
message ModeSwitch {
  TaskMode from = 1;
  TaskMode to = 2;
  string reason = 3;
  float confidence = 4;
}

// The context a classifier judges. The prompt/history are bounded server-side and
// never logged verbatim (a hash stands in for the prompt).
message ClassifyRequest {
  string prompt = 1;
  repeated Message history = 2;
}

// REST mapping (docs/design/rest-openapi/), under /v1/mode/. Classify carries a
// prompt + nested `history` (a content payload the server bounds/hashes) → POST
// body:*, not a query read.
service ModeService {
  rpc Classify(ClassifyRequest) returns (ModeVerdict) {
    option (google.api.http) = {
      post: "/v1/mode/classify"
      body: "*"
    };
  }
}
