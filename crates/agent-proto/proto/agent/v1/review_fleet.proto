// The `FleetRegistry` seam over gRPC (review-fleet C3, increment 3b): the
// durable roster of "who reviews what" as a CRUD control plane, so review
// sessions are added/updated/enabled at runtime and one roster can serve the
// fleet server. Mirrors `ProviderRegistryService` (one process holds the roster
// while any number of clients drive it).
//
// Security contract:
//   - `FleetSession.token_ref` is a kind-prefixed REFERENCE (`env:NAME` or
//     `file:/path`) — NEVER the secret. The forge token resolves on the host
//     that builds the concrete `Forge` (review-fleet C5); the roster stores and
//     serves only the reference, so a compromised control plane has no token to
//     exfiltrate. `Get`/`List` return the reference, never a resolved value.
//   - Every `id`/`user`/`repo` is untrusted (each may become a storage-path
//     segment): the server validates it (`safe_segment`) and rejects with
//     `InvalidArgument`.
//   - Every number is clamped on ingest (a peer is untrusted).
syntax = "proto3";

package agent.v1;

// One durable roster row — a review session's identity, the repo it watches, how
// it reaches its forge, and its triggers. Mirrors `agent_core::FleetSession`.
message FleetSession {
  // Identity — path-safe segments (server-validated). The workspace is
  // `root/<user>/<id>`.
  string id = 1;
  string user = 2;
  string repo = 3;
  // Forge: "github" | "gitlab" | "" (resolve as a registered forge).
  string backend = 4;
  string base_url = 5;
  // Kind-prefixed token reference: `env:NAME` or `file:/path` — NEVER the secret.
  string token_ref = 6;
  // Review skill/prompt selector ("" ⇒ the default review skill).
  string skill = 7;
  // Slack triggers ("" ⇒ no Slack trigger / no progress surfacing).
  string slack_trigger_channel = 8;
  string slack_progress_channel = 9;
  // Forge poll interval in seconds (clamped to [MIN, MAX] on ingest; 0 ⇒ default).
  uint64 poll_secs = 10;
  bool enabled = 11;
  // Unix-seconds metadata (clamped non-negative on ingest).
  int64 created_at = 12;
  int64 updated_at = 13;
  // Persisted forge card id (config C36 / D1b). When set, the row's forge is built
  // from the `ForgeCard` of this id in the `ForgeRegistry` (its kind/base_url/
  // token_ref/repo_encoding), and the inline `backend`/`base_url`/`token_ref` above
  // are ignored. Empty ⇒ the inline fields are used (unchanged behavior). Path-safe.
  string forge_id = 14;
}

message FleetListRequest {}

message FleetSessionList {
  repeated FleetSession sessions = 1;
}

message FleetSessionRef {
  string id = 1;
}

message FleetDeleteReply {
  bool deleted = 1; // false when the id was absent (not an error)
}

message FleetSetEnabledRequest {
  string id = 1;
  bool enabled = 2;
}

// Manually queue a review for one roster session's PR (review-fleet C8). Until the
// real triggers land (forge poll C6 / Slack watch C7, increment 4), this is how a
// review is kicked off. `session_id` names the roster row; `pr_number` the PR to
// review.
message ReviewNowRequest {
  string session_id = 1;
  uint64 pr_number = 2;
}

// Whether the trigger was queued or folded into one already pending/in-flight (the
// bounded queue coalesces duplicates and on overflow — never a silent drop).
message ReviewNowReply {
  bool accepted = 1; // false ⇒ coalesced into an existing pending/in-flight review
}

// Approve a persisted review draft and post it to its forge (review-fleet C17, the
// approve→post tail). `review_id` names the draft row (server-minted Uuid, persisted at
// `drafted`); the approval gesture is the ONLY thing that posts — nothing is posted
// without an explicit Approve call. Idempotent: a draft already `posted` is a no-op.
message ApproveRequest {
  string review_id = 1;
}

// The outcome of an Approve. `status` is one of:
//   "posted"         — the draft was posted this call (freshly).
//   "already_posted" — idempotent no-op: the draft was already posted.
//   "not_found"      — no persisted draft for this `review_id`.
// `detail` carries the posted comment/review URL when `status = "posted"`, else "".
message ApproveReply {
  string status = 1;
  string detail = 2;
}

// The roster control plane (mirrors ProviderRegistryService: one process holds
// the roster while any number of clients drive it). `token_ref` rides as a
// reference; the server never resolves it.
service ReviewFleetService {
  rpc List(FleetListRequest) returns (FleetSessionList);
  rpc Get(FleetSessionRef) returns (FleetSession);
  rpc Put(FleetSession) returns (FleetSession); // upsert = create + update
  rpc Delete(FleetSessionRef) returns (FleetDeleteReply);
  rpc SetEnabled(FleetSetEnabledRequest) returns (FleetSession); // toggle without a full Put
  // Manually queue a review (C8). Opt-in: served only by the full `--serve-fleet`
  // process (which has an orchestrator); the bare control-plane endpoint returns
  // UNIMPLEMENTED.
  rpc ReviewNow(ReviewNowRequest) returns (ReviewNowReply);
  // Approve a persisted draft → post it to its forge (C17). Opt-in: served only by the
  // full `--serve-fleet` process with persisted history wired (the approver needs to
  // look the draft up + build the row's forge); the bare control plane, or a process
  // with no history, returns UNIMPLEMENTED. This is the human approval gesture — the
  // ONLY path that posts; the model's own forge stays read-only (`dry_run`).
  rpc Approve(ApproveRequest) returns (ApproveReply);
}
