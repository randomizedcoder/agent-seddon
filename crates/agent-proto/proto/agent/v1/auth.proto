// The agent's token service (security-hardening S5,
// docs/design/security-hardening/02-token-service.md). An identity provider proves
// who a caller is (an OIDC ID token); the agent then issues its own short-lived
// ES256 JWT carrying the tenant, subject, roles and a permission snapshot, and every
// seam accepts only that token.
//
// Served beside the seams by any listener whose `[auth]` has a `[auth.token]`
// block; there is no dedicated port.
//
// Security contract:
//   - `Exchange` and `Jwks` need no bearer (a caller has no agent token yet, and a
//     verifier fetches the public keys). Every other RPC needs an agent token.
//   - `Exchange` accepts only ID tokens from a configured `[auth]` issuer; an agent
//     token is not accepted there, and an ID token is not accepted anywhere else.
//   - Every failure is an opaque `UNAUTHENTICATED`; the reason is logged, never sent.
//   - `Refresh` needs no bearer either: the refresh handle is the credential. It
//     is rotated on every use, and presenting a rotated-out handle revokes the
//     whole session (the token-theft signal).
//   - Every agent token names its auth session (`sid`). Sensitive actions
//     (approve, exec, role / binding / config writes) also check that the session
//     is still live, so `Logout` and `RevokeSession` stop them at once; other
//     calls stop when the token expires (S6).
syntax = "proto3";

package agent.v1;

service AuthService {
  // Trade an identity provider's ID token for an agent token.
  rpc Exchange(ExchangeRequest) returns (ExchangeResponse);
  // The public keys agent tokens are signed with, as a JWK Set.
  rpc Jwks(JwksRequest) returns (JwksResponse);
  // Who the caller's agent token says they are, and what it lets them do.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  // Trade a refresh handle for a new agent token and a new handle.
  rpc Refresh(RefreshRequest) returns (ExchangeResponse);
  // Revoke the caller's own session (the one its token names).
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // The caller's own sessions.
  rpc ListMySessions(ListMySessionsRequest) returns (ListSessionsResponse);
  // Revoke one of the caller's own sessions.
  rpc RevokeMySession(RevokeMySessionRequest) returns (RevokeSessionResponse);
  // Every session in a tenant; needs `read:binding` there.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // Revoke any session in a tenant; needs `write:binding` there.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // Role bindings in a tenant; needs `read:binding` there.
  rpc ListBindings(ListBindingsRequest) returns (ListBindingsResponse);
  // One role binding; needs `read:binding` there.
  rpc GetBinding(GetBindingRequest) returns (GetBindingResponse);
  // Create or replace a role binding; needs `write:binding` there, and may grant
  // only permissions the caller holds, never to the caller itself.
  rpc PutBinding(PutBindingRequest) returns (PutBindingResponse);
  // Remove a role binding; needs `delete:binding` there.
  rpc DeleteBinding(DeleteBindingRequest) returns (DeleteBindingResponse);
}

message ExchangeRequest {
  // An OIDC ID token (compact JWT) from a configured issuer. At most 16 KiB.
  string id_token = 1;
  // `portal` | `cli` | `service`; anything else is recorded as `unspecified`.
  string client_kind = 2;
}

message ExchangeResponse {
  // The agent token (compact JWT); send it as `authorization: Bearer <token>`.
  string access_token = 1;
  // Always `Bearer`.
  string token_type = 2;
  // Unix seconds after which the token is rejected.
  uint64 expires_at = 3;
  // The identity the token carries (the same fields `WhoAmI` returns).
  WhoAmIResponse principal = 4;
  // Opaque; send it to `Refresh` before `expires_at`. Each use returns a new one.
  string refresh_handle = 5;
  // Unix seconds after which the session cannot be refreshed; sign in again.
  uint64 session_expires_at = 6;
}

message JwksRequest {}

message JwksResponse {
  // The JWK Set document (`{"keys":[...]}`), as served at `/.well-known/jwks.json`.
  string jwks_json = 1;
}

message WhoAmIRequest {}

message WhoAmIResponse {
  // The verified organization; the caller's `x-agent-user-id`.
  string tenant = 1;
  // `user:<issuer>/<sub>` for a person, `svc:<name>` for a service.
  string subject = 2;
  // The login issuer's configured name.
  string issuer = 3;
  // Empty when the identity provider sent none.
  string email = 4;
  repeated string roles = 5;
  // `action:resource` pairs the roles grant in the caller's own tenant, as of when
  // the token was issued. Empty with `perms_ref` set when the list is too large to
  // embed; the roles are authoritative either way.
  repeated string permissions = 6;
  bool perms_ref = 7;
  // How the caller authenticated (`oidc:<issuer>`).
  repeated string amr = 8;
  // Unix seconds after which the token is rejected.
  uint64 expires_at = 9;
  // The auth session the token belongs to.
  string sid = 10;
}

message RefreshRequest {
  // The handle from the last `Exchange` or `Refresh`. At most 1 KiB.
  string refresh_handle = 1;
}

message LogoutRequest {}

message LogoutResponse {
  // False when the session was already revoked or expired.
  bool revoked = 1;
}

message ListMySessionsRequest {}

message ListSessionsRequest {
  // Empty ⇒ the caller's own tenant. Another tenant needs a host-global role.
  string tenant = 1;
}

message ListSessionsResponse {
  repeated AuthSessionInfo sessions = 1;
}

message RevokeMySessionRequest {
  string sid = 1;
}

message RevokeSessionRequest {
  // Empty ⇒ the caller's own tenant.
  string tenant = 1;
  string sid = 2;
}

message RevokeSessionResponse {
  // False when there was no live session with that id.
  bool revoked = 1;
}

// One auth session. Never carries a token or a refresh handle.
message AuthSessionInfo {
  string sid = 1;
  string tenant = 2;
  string subject = 3;
  string issuer = 4;
  string email = 5;
  // `portal` | `cli` | `service` | `unspecified`.
  string client_kind = 6;
  // Unix seconds.
  uint64 created_at = 7;
  uint64 last_seen_at = 8;
  uint64 expires_at = 9;
  // Zero while live.
  uint64 revoked_at = 10;
  // `logout` | `operator` | `reuse` | `binding` | empty.
  string revoke_reason = 11;
  // The session the caller's own token names.
  bool current = 12;
}

// Grants roles to a subject in one tenant. Roles are resolved when a token is
// minted (sign-in and every refresh): the union of the tenant's bindings that
// name the caller.
message RoleBinding {
  // Path-safe id, unique in the tenant.
  string id = 1;
  // Empty on write ⇒ the caller's own tenant. Another tenant needs a host-global
  // role.
  string tenant = 2;
  // `sub` (subject `<issuer>/<sub>`), `email` (a verified address), `domain`
  // (every verified address in it) or `mtls_san` (a service peer).
  string subject_kind = 3;
  string subject = 4;
  // Role names; each must exist when the binding is written.
  repeated string roles = 5;
  // Set by the server: who wrote the binding, and when (Unix seconds).
  string granted_by = 6;
  uint64 granted_at = 7;
  // Unix seconds; zero ⇒ never expires.
  uint64 expires_at = 8;
}

message ListBindingsRequest {
  // Empty ⇒ the caller's own tenant.
  string tenant = 1;
}

message ListBindingsResponse {
  repeated RoleBinding bindings = 1;
}

message GetBindingRequest {
  // Empty ⇒ the caller's own tenant.
  string tenant = 1;
  string id = 2;
}

message GetBindingResponse {
  RoleBinding binding = 1;
}

message PutBindingRequest {
  RoleBinding binding = 1;
  // By default a change that takes roles away (replacing a binding with fewer
  // roles, another subject, or an earlier expiry) revokes the sessions of every
  // subject the old binding named, so the change applies now rather than at their
  // next refresh. Set to leave them signed in.
  bool keep_sessions = 2;
}

message PutBindingResponse {
  RoleBinding binding = 1;
  uint32 revoked_sessions = 2;
}

message DeleteBindingRequest {
  // Empty ⇒ the caller's own tenant.
  string tenant = 1;
  string id = 2;
  // See `PutBindingRequest.keep_sessions`.
  bool keep_sessions = 3;
}

message DeleteBindingResponse {
  // False when there was no binding with that id.
  bool deleted = 1;
  uint32 revoked_sessions = 2;
}
