[package]
name = "agent-providers"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Router: composes N providers behind the LlmProvider trait (parity spec 25).
provider-router = []
# Pool: a health-checked, tiered pool with parallel fan-out. Reuses the router's
# circuit breaker, so it implies `provider-router`.
provider-pool = ["provider-router"]
default = ["provider-openai-compat"]
# OpenAI-compatible /chat/completions (covers GLM, OpenAI, vLLM, Ollama, …).
provider-openai-compat = []
# Anthropic-native Messages API.
provider-anthropic = []
# Consensus gate: generator × critic response gate with a bounded convergence loop
# (cognition-graph increment 01). Pure composition — no extra deps.
provider-consensus = []
# Parallel branches: split → concurrent lens branches → policy join → merge
# (cognition-graph increment 05). Reuses the gate's judge machinery, so it
# implies `provider-consensus`.
provider-branching = ["provider-consensus"]
# dhat-instrumented leak/allocation tests (tests/leak.rs).
dhat-heap = ["dep:dhat"]

[dependencies]
agent-core.workspace = true
# The one canonical retry/backoff library — never hand-roll a retry loop.
agent-retry.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["stream"] }
tracing.workspace = true
futures-util.workspace = true
async-stream.workspace = true
# `tokio::time::sleep` for the retry backoff (the runtime is already tokio).
tokio = { workspace = true }
dhat = { workspace = true, optional = true }

[dev-dependencies]
agent-testkit.workspace = true
agent-cache.workspace = true
rstest.workspace = true
# `test-util` enables `start_paused` — the branching join/timeout tests drive
# laggard branches on a paused clock instead of real sleeps.
tokio = { workspace = true, features = ["test-util"] }
iai-callgrind.workspace = true

# Guards the per-call selection hot path (`eligible`, ordered by policy).
[[bench]]
name = "pool_select"
harness = false
required-features = ["provider-pool"]

# Guards the task-router decision hot path (`route::Policy::resolve`). The `route`
# module is always compiled, so this bench needs no feature.
[[bench]]
name = "route_resolve"
harness = false

# Guards the consensus gate's per-round verdict parse/sanitize + no-progress compare.
[[bench]]
name = "gate_verdict"
harness = false
required-features = ["provider-consensus"]

# Guards the fork engine's dispatch path (clone/spawn/join/merge bookkeeping,
# concat merge — no LLM in the measurement).
[[bench]]
name = "branch_dispatch"
harness = false
required-features = ["provider-branching"]

[[test]]
name = "leak"
harness = true
required-features = ["dhat-heap", "provider-pool"]

[[test]]
name = "branch_leak"
harness = true
required-features = ["dhat-heap", "provider-branching"]

[lints]
workspace = true
