[package]
name = "agent-obs-check"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

# `obs-check`: a read-only pass over the observability stack. It runs every panel query
# of the provisioned Grafana dashboards through Grafana's own query API
# (`/api/ds/query`), checks that every Prometheus scrape target is up, and runs every
# HyperDX tile and saved search as HyperDX's read-only ClickHouse login. A broken query,
# macro, data source, grant or target shows up as a red check instead of a red or empty
# panel. The lib is the pure, testable core (the queries a dashboard holds, filled in as
# the browser would; tiles rendered to SQL; each reply's verdict). The binary is a thin
# HTTP client.
[lib]

[[bin]]
name = "obs-check"
path = "src/main.rs"

[dependencies]
reqwest.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true
