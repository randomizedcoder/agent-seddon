[package]
name = "agent-review-fleet"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The `sqlite` FleetRegistry backend — the roster row as JSON in an embedded
# SQLite BLOB, off by default so a normal build stays dependency-free (mirrors
# agent-registry's `registry-sqlite`).
fleet-sqlite = ["dep:rusqlite"]

[dependencies]
agent-core.workspace = true
async-trait.workspace = true
serde_json.workspace = true
# The orchestrator's bounded trigger queue (mpsc) + coalesce/state logging.
tokio = { workspace = true }
tracing.workspace = true
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
agent-testkit.workspace = true
rstest.workspace = true
tokio.workspace = true

[lints]
workspace = true
