[package]
name = "agent-review-fleet"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The `sqlite` FleetRegistry backend. PG-11 retired the bespoke embedded-SQLite
# `SqliteFleet`: the `sqlite` tier is now `StoreFleet` over a config-store
# `SqliteBackend` (the same JSON rows on the shared `cards`/`tenants` tables), so
# this forwards `fleet-store` + the config-store sqlite tier (mirrors `registry-sqlite`,
# PG-11). Off by default so a normal build stays dependency-free.
fleet-sqlite = ["fleet-store", "agent-config-store/config-store-sqlite"]
# The shared-store `FleetRegistry` backend (config C41 / A3b): the roster persists
# onto `agent-config-store` (memory/file/sqlite/postgres), the same JSON rows.
# Off by default — the legacy `Memory`/`File` backends are untouched.
fleet-store = ["dep:agent-config-store"]
# The Postgres arm of the shared-store backend: forwards to `agent-config-store`'s
# `config-store-postgres` (sqlx) tier. Off by default; NOT hermetic (needs a live
# server), so its tests are `#[ignore]`-gated (run via `nix run .#integration`).
fleet-store-postgres = ["fleet-store", "agent-config-store/config-store-postgres"]

[dependencies]
agent-core.workspace = true
# Per-tenant + per-repo fleet metrics (the C19 families + the `FleetMetrics` recorder).
agent-metrics.workspace = true
async-trait.workspace = true
serde_json.workspace = true
# The shared transactional config store the `fleet-store` backend persists onto
# (config C41 / A3b). Optional: a default build keeps the legacy backends only.
agent-config-store = { workspace = true, optional = true }
# The orchestrator's bounded trigger queue (mpsc) + coalesce/state logging.
tokio = { workspace = true }
tracing.workspace = true
# Server-minted review-round ids (C8/C14) — the same crate the session registry uses.
uuid = { workspace = true }

[dev-dependencies]
agent-testkit.workspace = true
rstest.workspace = true
tokio.workspace = true

[lints]
workspace = true
