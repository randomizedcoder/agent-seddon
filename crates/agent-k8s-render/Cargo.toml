[package]
name = "agent-k8s-render"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

# Invariant checks over the rendered Kubernetes manifests (k8s track K3). A pure
# structure-walker: no runtime deps on the rest of the workspace, no network, no
# cluster. The renderer (`nix/k8s/lib.nix`) emits YAML from structured Nix attrsets
# *so these tests can walk the structure* (docs/design/k8s/04). The real tree is read
# from `$AGENT_RENDERED_K3S` or, failing that, `../../rendered/k3s` relative to this
# crate — the `k8s-render-tests` flake check drives it over the committed store path.

[dependencies]
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true
