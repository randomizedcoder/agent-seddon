name: agent_portal
description: "Agent Portal — a Flutter, gRPC-only client for agent-seddon (docs/design/portal)."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  # gRPC transport: native (ClientChannel, dart:io HTTP/2) + web (GrpcWebClientChannel
  # via the envoy proxy). The generated stubs import package:grpc/service_api.dart.
  grpc: ^5.1.0
  protobuf: ^6.0.0
  fixnum: ^1.1.0
  # Open Grafana / HyperDX / Prometheus in the system browser from the Launcher.
  url_launcher: ^6.3.0
  # Render a review draft's markdown body in the Fleet tab (view + preview).
  flutter_markdown: ^0.7.4

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Source Serif 4 (SIL OFL 1.1) bundled as a tracked asset — the hermetic build
  # cannot fetch fonts at runtime, so we do not use google_fonts. See fonts/README.md.
  fonts:
    - family: SourceSerif4
      fonts:
        - asset: fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: fonts/SourceSerif4-Semibold.ttf
          weight: 600
