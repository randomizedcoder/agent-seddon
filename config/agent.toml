# Example wiring. Each string field under [agent] and [memory] selects a seam
# implementation (see DESIGN.md §5). Swap them to run experiments — no code edit.

[agent]
# Each name is resolved through the plugin registry (see docs/extending.md).
provider = "openai-compat"   # -> OpenAiCompatProvider ("anthropic" -> AnthropicProvider)
# Working directory the file/shell tools operate under. Empty ⇒ the process's
# current dir. Set this to point the agent at a target repo without cd-ing the
# process (embedded/served use, or the agent working on a checkout). `~` expands.
working_dir = ""
# "sliding-window" drops oldest turns; "summarizing-window" LLM-summarizes them
# (keeping the last `keep_recent_tokens` verbatim). "mode-aware-window" is
# summarizing-window plus a reshape on a task-mode switch (adaptive-cognition 02):
# on a switch it re-summarizes the middle through the destination mode's lens.
context  = "sliding-window"  # SlidingWindow | summarizing-window | mode-aware-window
# SECURITY: "auto-approve" runs every tool call (incl. bash) with NO confirmation.
# Only safe for trusted goals/inputs. The built-in default is "interactive".
# "allow-list" allows only the tool+arg patterns in the [policy] section below
# (deny the rest) — an unattended-but-scoped option. See docs/components/policy.md.
policy   = "auto-approve"    # -> AutoApprove ("interactive" | "allow-list")

max_iterations = 12
max_tokens     = 2048        # per-response output cap; reasoning models need more
temperature    = 0.7
# The budget compaction works against, so it must not exceed what the server will
# actually accept. Ollama serves its own `num_ctx` (a few thousand tokens by
# default) regardless of the model's advertised maximum, so 8192 is deliberately
# conservative — overstating it means the server silently truncates instead of
# the agent compacting. Raise it for a large-context hosted model.
context_window = 8192
reserve_output = 2048
keep_recent_tokens = 4000    # summarizing-window: recent history kept verbatim

# stream=true consumes the provider's incremental SSE stream and echoes assistant
# text live to stderr. Set false for the buffered path (an escape hatch for
# servers that misbehave on SSE; also the only path that reports token usage for
# openai-compat). parallel_tools runs a turn's parallel-safe tool calls at once.
stream         = true
parallel_tools = true
# Per-tool wall-clock timeout (seconds): a backstop so a hung tool becomes an error
# observation instead of freezing the loop. Generous by default (bash has its own
# shorter timeout); 0 disables the loop-level guard.
tool_timeout_secs = 600

# Subagents: expose a `delegate` tool so the model can spawn child agents with
# an isolated context (they return only a final summary). Off by default —
# nested loops multiply token cost. subagent_max_depth bounds recursion.
subagents          = false
subagent_max_depth = 2

system_prompt = """
You are a coding agent operating in a terminal working directory. Use the
provided tools (bash, read_file, write_file, edit, grep, find, ls, search) to
inspect and modify files and to run commands. Prefer `edit` over rewriting whole
files, `search` (indexed full-text) to find code fast during planning, and
`grep`/`find`/`ls` to navigate. To work across branches without checking them out,
use the git tools: `git_read`/`git_tree`/`git_diff`/`git_grep`/`git_log` read any
revision, `git_branches`/`git_status` survey the repo, and `git_worktree`/
`git_checkpoint` materialize disposable checkouts and save private checkpoints.
Use `metrics` to inspect your own performance
(latency, token/tool counts, search index state). Work step by step: call a tool,
observe the result, then decide the next step. When the task is complete, reply
with a short plain-text summary and do not call any more tools.
"""

# --- provider examples ----------------------------------------------------
# openai-compat (shown): Ollama / vLLM / OpenAI / any OpenAI-compatible endpoint.
#
# The default below targets a LOCAL Ollama, so a fresh clone can run with no
# account and no key. Pull a model that really calls tools first — the loop is
# useless without it:
#
#     ollama pull llama3.1:latest
#
# `ollama show <model>` listing `tools` is necessary but NOT sufficient: some
# models advertise it and still emit tool-call-shaped JSON as prose, leaving you
# with a confident answer and an untouched directory. llama3.1 was verified doing
# the task; qwen2.5-coder:7b advertises `tools` and did not work.
#
# See config/local-ollama.toml for the same thing as a minimal standalone file.
[provider]
base_url = "http://localhost:11434/v1"
model    = "llama3.1:latest"
# The API key is NOT stored in this repo. Resolution order: api_key (inline) >
# api_key_env (env var) > api_key_file (path). One of the three is REQUIRED —
# the build fails without it. Ollama ignores the value, so a placeholder is fine:
api_key = "ollama"
# api_key_env  = "AGENT_API_KEY"    # hosted endpoints: read from this env var
# api_key_file = "~/.config/agent-seddon/key"   # …or from a file outside the repo
max_retries  = 3             # retry transient 429/5xx/timeout with backoff (0 = off)
# insecure_tls = true        # skip TLS verification — ONLY for a self-signed dev
#                            # endpoint you control. Off by default on purpose.
# Whether this model accepts image content blocks (parity spec 26). OFF by default:
# this endpoint is generic, and sending an image to a text-only model fails the
# whole request. Ignored by the Anthropic provider (every Claude model takes
# images). See docs/components/multimodal.md.
# supports_vision = true
# version = "2023-06-01"       # Anthropic `anthropic-version` header (Anthropic only)
#
# To use Anthropic instead, set provider = "anthropic" above and:
#   [provider]
#   model        = "claude-opus-4-8"
#   api_key_env  = "ANTHROPIC_API_KEY"   # or api_key_file = "~/.anthropic-key"
#   # base_url defaults to https://api.anthropic.com/v1; version to 2023-06-01.

[memory]
backend       = "file"                    # whole store: FileEpisodic + FileSemantic (registry-selected)
episodic_path = ".agent/episodic.jsonl"   # append-only event log ("what happened")
semantic_dir  = ".agent/memory"           # curated markdown facts ("what is true")
recall_limit  = 5
# semantic    = "vector"                  # swap ONLY the semantic layer (composed w/ file episodic)
# distill     = true                      # opt in to model-backed episodic -> semantic promotion
#                                         # (off by default: no extra model call per run)

[tools]
# Empty list = every registered tool. Name a subset to restrict (must be
# registered, i.e. compiled in via cargo features). Note: MCP tools (below) are
# always added when their server is configured — this allowlist only filters the
# built-ins.
enabled = [
    "bash", "read_file", "write_file", "edit", "apply_patch", "grep", "find", "ls", "search", "index_ls", "metrics",
    "find_symbol", "find_implementations", "find_interface", "find_callers", "find_callees",
    "find_callchain", "find_changed_callers", "find_dependency_path", "structural_search",
    "git_read", "git_tree", "git_diff", "git_grep", "git_log", "git_branches", "git_status",
    "git_worktree", "git_checkpoint",
]

# High-performance code search (the SearchBackend seam). `backends` selects which
# backends front the single search interface (first = default; empty ⇒ ["tantivy"]);
# multiple lets you compare them head-to-head under Prometheus/tracing. The index
# lives under <repo>/.agent-seddon/index/<backend> unless `index_dir` overrides it.
# `auto_index` checks freshness on start and reindexes in the background if stale.
# See docs/components/search.md.
[search]
backends   = ["tantivy"]
index_dir  = ""              # empty ⇒ per-repo .agent-seddon/index/<backend>
auto_index = true

# Type-aware code graph (the AstBackend seam). `backends` selects which engines front
# the single graph interface (first = default; empty ⇒ ["go"]). The `go` engine runs
# the pinned `agent-go-graph` helper (x/tools: precise call graph + implicit interface
# satisfaction) through the Sandbox; add "grpc" to dial a remote `--serve-ast`.
# `auto_index` warms the graph in the background on start. Exposes the `find_*` tools
# (find_callers/callees/callchain/implementations/interface/symbol/dependency_path/
# changed_callers). See docs/components/ast.md.
[ast]
# "go"   — deep native Go engine (agent-go-graph helper)
# "rust" — deep native Rust engine (charon MIR: precise call graph + trait impls;
#          needs the ast-rust build + charon & a Rust toolchain at runtime)
# "scip" — cross-language symbols/impls breadth engine (needs the ast-scip build)
# Order = default engine + call-graph routing priority (first that resolves wins).
backends            = ["go"]
auto_index          = true
helper_timeout_secs = 30       # raise for "rust": charon does a full MIR build
scip_langs          = []       # e.g. ["go", "rust"] — indexers for the "scip" backend

# Cross-session recall (parity spec 20): a tantivy index over the agent's own PAST
# saved transcripts, exposed as the `session_recall` tool so it can search its
# history ("how did we fix X?"). Transcripts are rendered + secret-redacted before
# indexing. OFF by default — a fresh checkout has no history worth searching. See
# docs/components/search.md (DocumentSource) and docs/components/session-export.md.
[recall]
enabled      = false
sessions_dir = ""            # empty ⇒ <working_dir>/.agent/sessions (the REPL's)
index_dir    = ""            # empty ⇒ <sessions_dir>/.recall/index
auto_index   = true

# Tokenizer (the Tokenizer seam): accurate per-model token counts that drive
# compaction budgeting + USD/cache cost accounting, replacing the ~chars/4
# heuristic. Backends (config-selected like every seam):
#   "approx"   — dependency-free Unicode segmenter (the default; always available)
#   "tiktoken" — exact OpenAI-family BPE (offline, vendored ranks); build with the
#                `tokenizer-tiktoken` feature. Unknown models fall back to approx.
#   "hf"       — a local model's tokenizer.json (Qwen/GLM/Llama); build with the
#                `tokenizer-hf` feature and set [tokenizer.hf] below.
#   "provider" — count via a provider's messages/count_tokens endpoint (network +
#                key); build with `tokenizer-provider` and set [tokenizer.provider].
#   "grpc"     — dial a remote tokenizer seam (see [grpc.tokenizer]); one count for
#                a fleet.
# See docs/components/tokenizer.md.
[tokenizer]
backend = "approx"

# For backend = "provider": an Anthropic-style count-tokens endpoint. The key is
# read from `api_key_env` (preferred) or `api_key`; it never appears in a result,
# error, or log. On any failure the agent falls back to the heuristic.
# [tokenizer.provider]
# base_url    = "https://api.anthropic.com/v1"
# api_key_env = "ANTHROPIC_API_KEY"
# version     = "2023-06-01"
# timeout_secs = 30

# For backend = "hf": a catch-all `default` tokenizer.json plus optional per-model
# overrides keyed by model-id PREFIX (longest match wins). A file that is missing,
# oversized (>64 MiB), or unparseable is skipped and those models use approx.
# [tokenizer.hf]
# default = "/models/qwen2.5-coder/tokenizer.json"
# [tokenizer.hf.models]
# "llama" = "/models/llama-3/tokenizer.json"

# The web_fetch tool (the WebBackend seam). GET a URL → sanitized markdown/text/
# html under size/timeout/redirect caps. `backend` = "local" (in-process reqwest).
# The SSRF guard (in the Policy seam) denies loopback/private/link-local/metadata
# targets by default; `allow_private = true` opts local dev back in, and
# `allow_hosts` globs exempt named hosts. See docs/components/web-fetch.md.
[web]
backend          = "local"
max_bytes        = 5242880   # 5 MiB body cap (declared + streamed)
timeout_secs     = 30        # default per-request timeout
max_timeout_secs = 120       # upper bound a caller-requested timeout is clamped to
max_redirects    = 5
allow_private    = false     # true ⇒ allow loopback/private/link-local targets
allow_hosts      = []        # host globs that bypass the SSRF screen, e.g. ["*.internal"]

# The todo_write tool (the TaskTracker seam). Structured plan: status
# (pending/in_progress/completed/cancelled) + priority (high/medium/low), atomic
# full-list replace, at-most-one in_progress. `backend` = "memory" (per-session,
# in-process). Plan progress is surfaced as agent_tasks_open/closed gauges. See
# docs/components/tasks.md.
[tasks]
backend = "memory"

# Structured output (the OutputSchema seam). Constrain a completion to a JSON
# schema, validate the result, and repair once on mismatch. `validator` selects
# the impl ("draft07" = the dependency-free draft-07 subset); `max_repairs`
# bounds the one-shot repair loop. Reached via `Agent::complete_structured`. See
# docs/components/structured-output.md.
[structured]
validator   = "draft07"
max_repairs = 1

# Execution isolation for `bash` (the Sandbox seam). `backend`:
#   "local" — unconfined spawn (today's behaviour; the default).
#   "nix"   — run each command inside the repo's pinned flake dev-shell closure
#             (`nix develop <flake> -c bash -c …`), so the toolchain/$PATH is
#             exactly nix/versions.nix — reproducible + content-addressed, no
#             ambient host toolchain. Requires `nix` on PATH.
# See docs/components/sandbox.md.
[sandbox]
backend = "local"

# Embedding model for semantic search (the Embedder seam). `backend` = "local"
# (dependency-free feature-hashing embedder; no model/network). `dimensions` sizes
# its vectors. To enable SEMANTIC + HYBRID code search, add "vector" to
# `[search] backends` below (e.g. backends = ["tantivy", "vector"]) and query the
# search tool with mode "semantic" or "hybrid". See docs/components/embedder.md.
[embedder]
backend    = "local"
dimensions = 256

# Session history (the SessionStore seam). Content-addressed, immutable checkpoints
# of the conversation with a branch tree + undo/branch/fork/diff/prune — reached via
# Agent::checkpoint / restore_checkpoint / list_checkpoints. `backend` = "file"
# (immutable JSON objects under `dir`); `dir` empty ⇒
# <working_dir>/.agent-seddon/session. See docs/components/session.md.
[session]
# "file" (a local content-addressed store) or "grpc" (a shared remote store —
# several agents on one history, handing work between them by checkpoint id, with
# the immutable objects deduplicating across them). The grpc endpoint comes from
# [grpc.session] below. See docs/components/session.md.
backend = "file"
dir     = ""
# Checkpoint the working set after each completed turn, so restore/branch/undo
# have something to work with. OFF by default (it costs disk per turn).
auto_checkpoint = false

# `@`-reference expansion (the ReferenceResolver seam). Expands `@file:src/lib.rs`,
# `@file:src/lib.rs:40-80`, `@dir:src/auth`, `@symbol:AuthService`, and
# `@url:https://…` mentions in a prompt into context blocks before the turn.
# `@file`/`@dir` read the workspace (path-confined against traversal AND symlink
# escape, sensitive paths denied); `@symbol` routes through the SearchBackend and
# `@url` through the WebBackend, reusing its SSRF guard. Every resolved block is
# injection-scanned. `backend` = "local". `budget_tokens` caps total expansion per
# prompt — over 50% of it leaves the prompt unmodified (0 ⇒ unbounded);
# `per_block_max_chars` truncates a single oversized block.
# See docs/components/reference.md.
[reference]
backend             = "local"
budget_tokens       = 8000
per_block_max_chars = 8000

# Content security scanning (the Scanner seam). Findings feed the Policy gate: a
# finding at or above `deny_at` blocks the call, so a secret in a write_file body
# denies the write instead of merely being logged. Scanned calls are the
# side-effecting ones (write_file/edit/apply_patch body, bash command).
# OFF by default — `rules` empty means no scanning. Enable with:
#   rules = ["secret", "threat"]
# A rule may also be "grpc" — a REMOTE scanner (see [grpc.scanner]), which
# composes with the local ones: rules = ["secret", "grpc"] runs both. That
# centralises the ruleset: one scanner process holds the rules and every agent
# pointed at it inherits a change without redeploying.
#   NOTE the remote is deliberately FAIL-OPEN, as the seam contract requires: if
#   it is unreachable it contributes no findings rather than blocking every call.
#   That means scanning silently stops. The compensating control is the WARN it
#   logs (`scanner.transport_failed`) — alert on it.
# `deny_at` = info|low|medium|high|critical. `allow_rules` waives specific rule
# ids (e.g. a known fixture secret) without disabling the scanner. `scope` sets
# threat-pattern breadth: all (high-confidence only) | context | strict.
# See docs/components/scanner.md.
[scanner]
rules       = []
deny_at     = "high"
allow_rules = []
scope       = "context"

# Tool-call verifier (the Verifier seam): a CORRECTNESS gate on a requested tool
# call, checked before it runs — distinct from the Policy/Scanner SAFETY gates.
# It sees the goal + history (which Policy does not) and returns allow / revise /
# deny. `backend` selects the impl; EMPTY (default) ⇒ OFF (no verifier, no cost).
#   "schema" — deterministic, model-free: validate the call's arguments against
#              the tool's JSON Schema and ask the model to revise on a mismatch
#              (e.g. a required argument missing). No model, always safe.
# `mode` gates whether a non-allow verdict changes behaviour:
#   "shadow"  (default) — the verdict is only observed (logged + the
#                         agent_verifier_verdicts_total metric). Turning a
#                         verifier on stays safe.
#   "enforce" — a revise/deny BLOCKS the call and feeds its message back to the
#               model, which can reissue a corrected call.
# An LLM-backed verifier, an ensemble, and a dedicated ClickHouse verdict table
# are follow-ups. See docs/design/tool-call-verification.md and
# docs/components/verifier.md.
[verifier]
backend = ""
mode    = "shadow"

# Prompt-cache breakpoint placement (the CacheStrategy seam). A turn is dominated
# by a stable prefix (system prompt + tool defs + history); providers cache it,
# but only if the anchors sit on a prefix that is byte-identical turn to turn.
# `strategy`:
#   "stable-prefix" (default) — anchor system + tool defs + the newest history
#                               message that is not the volatile tail
#   "tail-window"             — anchor the head plus a message `tail_back` from
#                               the end (opencode's shape)
#   "off"                     — place nothing; the request is byte-identical
# Placement is automatically a no-op on providers with no prompt cache, and for
# OpenAI-family providers it emits a stable `prompt_cache_key` instead of anchors.
# See docs/components/prompt-cache.md.
[cache]
strategy  = "stable-prefix"
tail_back = 2

# Live web search (the WebSearch seam). `backends` lists providers in preference
# order — the first is the default, the rest are selectable per query via the
# tool's `backend` argument (an unknown name falls back to the default).
# EMPTY (default) ⇒ the `web_search` tool is not registered at all.
# Results are cached for `cache_ttl_secs`, keyed by (backend, normalized query,
# options), so a repeated search inside the TTL costs nothing; a stale entry is
# served while it refetches. The API key is never echoed into results, errors,
# spans, or the cache. See docs/components/web-search.md.
# Provider routing + failover (the Router). Select with `[agent] provider =
# "router"`. `providers` names OTHER registered providers in preference order;
# each is built through the registry, so a candidate can itself be "grpc" — one
# router can span local and remote providers.
# A *retryable* failure (429/5xx/timeout) transparently continues on the next
# candidate; a *terminal* one (auth/billing/bad request) does not, since it would
# fail identically everywhere. Repeated failures open a per-candidate circuit
# breaker that closes after `cooldown_secs`. See docs/components/router.md.
# Lifecycle hooks fired from the loop (the Hook seam). `enabled` lists built-in
# hooks in DISPATCH order. Empty (default) ⇒ no hooks and no per-turn cost; an
# unknown name fails the build rather than silently disabling observability.
# Built-in: "tracing" (structured log + metric at each lifecycle point).
# A `pre_tool` hook runs AFTER the Policy decision, so a hook can only narrow
# permission, never widen it. See docs/components/hooks.md.
[hooks]
enabled = []

# Skill authoring (parity spec 30): the agent captures a reusable procedure as a
# SKILL.md that spec 07's discovery picks up on the next run. OFF by default —
# an authored skill is read back into FUTURE system prompts, so writing one is a
# privileged, persistent action. The name is confined to a single path segment,
# and the body + description are injection-scanned before anything reaches disk.
# `write_dir` empty ⇒ <working_dir>/.agent/skills.
# See docs/components/skill-authoring.md.
[skills]
write     = false
write_dir = ""

# Remote code-collaboration platform (the Forge seam). Local git stays with the
# git_* tools; this is only the PR/issue/review API. OFF by default (`backend`
# empty ⇒ the `forge` tool is not registered).
# Writes mutate a shared remote and are visible to humans, so `dry_run` defaults
# TRUE: the agent previews the request shape until an operator turns it off.
# The token never appears in results, errors, or spans; a missing one is a
# distinct error, not an empty result. See docs/components/forge.md.
# Recurring unattended runs (the Scheduler seam). `enabled` registers the
# `schedule` tool so the agent can create/list/cancel jobs — but nothing FIRES
# until a driver ticks (`agent --scheduler`), so turning this on cannot start
# unattended work as a side effect.
# A job whose previous run is still in flight is SKIPPED, not stacked (and the
# skip is recorded); a crashed run's claim expires after `claim_ttl_secs` so it
# cannot wedge the job forever. See docs/components/scheduler.md.
# Interactive terminal sessions (the Pty seam). A live tty the agent holds ACROSS
# TURNS is strictly more powerful than one-shot `bash` — it survives turns, holds
# a real process, and accepts arbitrary keystrokes — so it is OFF by default and
# every call still passes the Policy gate. Output retention is a bounded 2 MiB
# rolling buffer; a reader that falls behind is told how many bytes it missed.
# See docs/components/pty.md.
[pty]
enabled      = false
# "local" (a tty on this host) or "grpc" (a remote terminal host — see the
# warning by [grpc.pty]).
backend      = "local"

max_sessions = 8

[scheduler]
enabled        = false
tick_secs      = 30
max_jobs       = 64
claim_ttl_secs = 900

[forge]
backend   = ""              # "" | "github" | "gitlab"
# github:
# owner   = "randomizedcoder"
# repo    = "agent-seddon"
# gitlab:
# project = "group/project"   # or a numeric project id
# token_env = "GITHUB_TOKEN"  # or GITLAB_TOKEN
dry_run   = true

[router]
providers         = []            # e.g. ["anthropic", "openai-compat"]
policy            = "in-order"    # in-order | round-robin
failure_threshold = 3
cooldown_secs     = 30

# Health-checked, load-balanced pool of LLM/GPU targets (docs/design/gpu-pool/). An
# active liveness probe + circuit breaker route around a target that is offline; the
# selection policy routes around one that is busy. Empty ⇒ no pool.
[pool]
# `policy` orders the healthy, capable members before dispatch:
#   cost (default, cheapest-first) | least-loaded (fewest in-flight — best for a
#   heterogeneous GPU pool) | round-robin | weighted (by per-member `weight`).
policy            = "cost"
# When every eligible member is at its concurrency cap: shed (fail-soft, default) or
# wait (bounded wait for a permit, then shed). Never an unbounded queue.
on_saturation     = "shed"        # shed | wait
saturation_wait_ms = 500          # bounded wait budget for `wait` (clamped <= 30s)
# Latency-graded health (GPU pool 03): a member whose smoothed (EWMA) request latency
# exceeds degraded_threshold_ms is "degraded" (alive but slow) and sorted AFTER the
# healthy members — a fast target is preferred over a slow one. 0 disables grading.
latency_alpha        = 0.3        # EWMA smoothing factor in (0,1]
degraded_threshold_ms = 0         # e.g. 20000 to demote a target answering slower than 20s
fanout            = 3              # max members a fan-out (e.g. the mode vote) touches
probe_interval_secs = 15          # active liveness probe cadence (0 ⇒ off; clamped [5,3600])
probe_timeout_secs  = 3           # per-probe deadline (clamped [1,60])
failure_threshold   = 3           # consecutive failures that open a member's breaker
cooldown_secs       = 30          # how long a breaker stays open before re-probing
#
# Two ways to declare members:
#  (a) bare names resolved via the registry, tiers parallel by position:
# members = ["glm", "mi50"]
# tiers   = ["heavy", "medium"]   # light | medium | heavy (a >= floor); missing ⇒ medium
#
#  (b) detailed blocks — one config block per GPU target, with routing knobs. An
#      inline `endpoint` synthesizes an OpenAI-compatible provider (no separate
#      [provider.*] stanza needed):
# [[pool.members]]
# name = "mi50"
# endpoint = "http://mi50:11434/v1"   # ollama/vLLM/… OpenAI-compatible base URL
# model = "mistral-small:24b"
# tier = "medium"
# weight = 1.0                        # relative pick rate under `weighted`
# max_concurrency = 2                 # per-target concurrency cap (0/unset = unbounded)
#
# An AUTHENTICATED / self-signed HOSTED upstream is a member too, with NO secret in
# this file (model-router increment 01). Key resolution: api_key > api_key_env >
# api_key_file; all empty ⇒ keyless (a local server that ignores it).
# [[pool.members]]
# name = "glm"
# endpoint = "https://213.173.96.56:8000/v1"
# model = "/model"
# api_key_file = "~/Downloads/runpod/glm/glm-api-key"  # or api_key_env = "GLM_KEY"
# insecure_tls = true                 # self-signed dev endpoint ONLY (warns; MITM risk)
# context_window = 131072             # per-member; unset ⇒ the global [agent] context_window
# tier = "heavy"
# weight = 4.0
#
# [[pool.members]]
# name = "local-registry-member"      # no endpoint ⇒ resolve `name` via the registry
# tier = "light"

# Task-aware routing (the TaskRouter — model-router increment 02). Selected with
# `[agent] provider = "task-router"`. Routes each request to a declaratively-preferred,
# CAPABLE upstream and fails over on a retryable error — a fleet as one provider (e.g.
# Kimi preferred, GLM fallback). An upstream's capability facts (context window, tools,
# vision) are read live from the provider; tags/tier/input_cost are your routing
# metadata. Keys are NEVER in this file: api_key > api_key_env > api_key_file.
# [route]
# [[route.upstreams]]
# name = "kimi"                        # inline endpoint ⇒ OpenAI-compatible provider
# endpoint = "https://…-4000.proxy.runpod.net/v1"
# model = "moonshotai/Kimi-K3"
# api_key_file = "~/Downloads/runpod/glm/kimi-api-key"
# context_window = 131072             # per-upstream; unset ⇒ the global [agent] one
# tags = ["reasoning", "long-context"]
# tier = "heavy"
# input_cost = 3.0                    # per-Mtok hint for cost-aware ordering
#
# [[route.upstreams]]
# name = "glm"
# endpoint = "https://213.173.96.56:8000/v1"
# model = "/model"
# api_key_file = "~/Downloads/runpod/glm/glm-api-key"
# insecure_tls = true                 # self-signed dev endpoint ONLY (warns)
# tags = ["reasoning"]
# tier = "heavy"
# input_cost = 1.0
#
# # Ordered rules — the first whose `match` holds sets the ordering preference.
# [[route.rules]]
# match  = { role = "review" }        # role: main|judge|classify|summarize|verify|review
# prefer = { tags = ["reasoning"], tier = "heavy" }
#
# # Applied when no rule matches — here: prefer kimi, fall back to glm.
# [route.default_prefer]
# upstreams = ["kimi", "glm"]
# # failure_threshold = 3 / cooldown_secs = 30  (breaker, same as [router]/[pool])

# The consensus gate (cognition-graph increment 01): every final answer is generated
# by `generator` and challenged by `critic` (ideally a DIFFERENT model family) in a
# bounded revise loop; preference-shaped disagreement is recorded as "Open
# alternatives" with reconsider-when triggers instead of argued to capitulation.
# Select with `[agent] provider = "consensus"`. `generator`/`critic` resolve like
# route upstreams: a `[[route.upstreams]]` name (key via api_key_file/env — never
# inline), else a registry provider type. Streaming bypasses the gate — run
# `stream = false`. See docs/design/cognition-graph/01-consensus-gate.md.
#
# [consensus]
# generator = "kimi"
# critic    = "glm"
# max_rounds = 2                      # critic rounds before exhaustion (ceiling 5)
# scope = "final"                     # "final" | "every-iteration"
# on_exhaustion = "deliver-with-note" # "deliver-with-note" | "fail"
# critic_max_tokens = 512
# max_alternatives = 3
# rubric_file = ""                    # operator rubric (overrides the built-in)

# The digest ledger + background distiller (cognition-graph 02): every delivered
# response is summarized + fact-extracted in the background (per-session FIFO
# worker; the reply path never waits) into rows keyed (session_id, agreed_seq),
# which instant compaction later assembles instead of summarizing on the critical
# path. "clickhouse" (the default deployment target) reuses the [telemetry]
# connection with DURABLE writes (async_insert + wait_for_async_insert — not the
# lossy telemetry channel); "sqlite" keeps a single-file ledger for server-less
# runs. See docs/design/cognition-graph/02-background-distiller.md.
#
# [digest]
# store = "clickhouse"               # "" (off) | "clickhouse" | "sqlite" | "grpc"
# path = ".agent/digests.sqlite3"    # sqlite backend only
# summary_max_tokens = 512
# facts_max_tokens = 256

# Instant compaction (cognition-graph 03): select with
# `[agent] context = "instant-window"` (requires [digest] store). Compaction
# ASSEMBLES from the pre-computed ledger — one small current-objective call +
# relevance selection over the summaries + the facts block + open alternatives —
# instead of summarizing the whole history on the critical path; any miss falls
# back to the classic summarizing window, then truncation.
#
# [instant]
# relevance = "llm"                  # "llm" | "keyword" (zero extra calls) | "all"
# objective_max_tokens = 128
# min_coverage = 0.6                 # ledger coverage of the span; below → fallback
# facts_max_chars = 4096
# alternatives_max_chars = 2048

# The cognition-graph document (cognition-graph 04): the declarative node graph
# re-expressing the gate/distiller/compaction wiring above, editable as data
# (and, served via --serve-graph, by the portal's drag-drop editor). Off by
# default — with no [graph] store the increments behave exactly as their own
# blocks configure them. The file backend re-validates the textproto document
# on every read and rejects invalid documents wholesale (typed per-node
# issues). See docs/design/cognition-graph/04-graph-config.md.
#
# [graph]
# store = "file"                     # "" (off) | "file" | "grpc" (central editor service)
# file = ".agent/graph.textproto"    # file backend only; see config/cognition/ examples

# General task-mode detection (the TaskClassifier seam). Runs every turn to detect
# when to switch to a more appropriate mode; drives the in-loop review hand-off, and
# (later) mode-aware compaction + dimensional memory. ON by default — with no [pool]
# configured only the free deterministic prefilter runs, so the per-turn cost is
# near zero. See docs/components/mode.md + docs/design/adaptive-cognition/.
[mode]
classifier       = "hybrid"       # "hybrid" | "grpc" | "" (off)
confidence_floor = 0.6            # a candidate mode must reach this to switch
hysteresis       = 2              # consecutive turns a non-decisive candidate must win

# Per-step dimensional memory (adaptive-cognition 03): a cheap per-turn pass files
# "what just happened" into per-dimension histories (<memory.semantic_dir>/
# dimensions/<dim>.md), and a mode switch recalls the destination mode's dimensions
# as fresh context. OFF by default — unlike mode detection's free prefilter, the
# per-step summarize is a real (cheap, local-tier) LLM call per turn.
[dimensions]
store = ""                        # "" / "off" (disabled) | "file" | "grpc"

[web_search]
backends          = []            # e.g. ["brave"] or ["searxng", "brave"]
cache_ttl_secs    = 900
cache_max_entries = 256
default_limit     = 5
timeout_secs      = 20
max_retries       = 2
# Brave: key resolution is brave_api_key (inline) > brave_api_key_env (env var).
# brave_api_key_env = "BRAVE_SEARCH_API_KEY"
# brave_endpoint    = "https://api.search.brave.com/res/v1/web/search"
# SearXNG: point at your own instance's JSON search endpoint (no key needed).
# searxng_endpoint  = "http://localhost:8888/search"

# Language servers (the LspBackend seam). The agent can verify edits
# (`diagnostics`) and navigate code (`hover`/`definition`/`references`/`rename`/
# `document_symbols`) via real servers over JSON-RPC/stdio. OFF by default (no
# `[[lsp.servers]]` ⇒ no daemons). Uncomment a server to enable the `lsp` tool for
# that language. The binaries below are supplied by the flake (nix/versions.nix
# `lspServers`), so they're on PATH inside `nix develop`. See docs/components/lsp.md.
#
# [[lsp.servers]]
# language   = "rust"
# command    = ["rust-analyzer"]
# extensions = ["rs"]
#
# [[lsp.servers]]
# language   = "go"
# command    = ["gopls"]
# extensions = ["go"]
#
# [[lsp.servers]]
# language   = "cpp"
# command    = ["clangd"]
# extensions = ["c", "h", "cc", "cpp", "cxx", "hpp"]
#
# [[lsp.servers]]
# language   = "python"
# command    = ["pyright-langserver", "--stdio"]
# extensions = ["py"]
#
# [[lsp.servers]]
# language   = "typescript"
# command    = ["typescript-language-server", "--stdio"]
# extensions = ["ts", "tsx", "js", "jsx"]

# Multi-branch git (the RepoBackend seam). One shared bare/mirror object DB fronts
# many disposable `git worktree`s, so the agent can read, diff and analyze code
# across branches without many full clones. `backend` selects the impl: "cli"
# (shells out to git — the default, zero extra deps) or "grpc" (a remote seam).
# The mirror/worktrees live under <repo>/.agent-seddon/ unless overridden.
# `push_policy` gates the only operation that leaves the sandbox (default "never":
# checkpoints stay in private local refs). See docs/components/git.md.
[git]
backend       = "cli"
mirror_dir    = ""           # empty ⇒ <repo>/.agent-seddon/mirror
worktrees_dir = ""           # empty ⇒ <repo>/.agent-seddon/worktrees
remote        = ""           # empty ⇒ infer from the checkout's origin
auto_fetch_secs = 0          # >0 ⇒ background-fetch the mirror if older than this
max_worktrees = 8
push_policy   = "never"      # never | checkpoint-only | explicit

# External MCP (Model Context Protocol) servers. Their tools are discovered at
# startup and registered as `mcp_<server>_<tool>`. Best-effort: a server that
# fails to start is logged and skipped. A server is stdio (has `command`) or
# HTTP (has `url`). Off unless you add a server here.
#
# [[mcp.servers]]                         # stdio: spawned as a subprocess
# name    = "filesystem"
# command = "npx"
# args    = ["-y", "@modelcontextprotocol/server-filesystem", "."]
# # env   = { SOME_KEY = "value" }
#
# [[mcp.servers]]                         # http: streamable-HTTP endpoint
# name    = "remote"
# url     = "https://mcp.example.com/mcp"
# # headers = { Authorization = "Bearer …" }

# Stream the full transaction history (agent_events), logs (agent_logs), and
# per-turn token usage (agent_usage) into ClickHouse, keyed by a per-run
# session_id. Off by default — start the container first with
# `nix run .#clickhouse-up`, then set enabled = true. Never blocks the loop: if
# ClickHouse is unreachable, rows are dropped and the .agent/episodic.jsonl log
# still holds the full record.
[telemetry]
enabled          = false
clickhouse_url   = "localhost:9000"   # native protocol (TCP), host:port
database         = "agent"
user             = "default"
password         = ""
stream_logs      = true       # also send tracing logs to agent_logs
batch_max_rows   = 256
flush_interval_ms = 1000
# Distributed tracing via OpenTelemetry, exported over OTLP/gRPC to the ClickStack
# OTEL collector. Independent of `enabled` above (that gates the native ClickHouse
# sink). Empty = no exporter (default). Set it to the collector's OTLP gRPC
# endpoint to turn it on:
# otlp_endpoint     = "http://localhost:4317"
# otel_service_name = "agent-seddon"       # service.name on exported spans

# Always-injected user context. Files in <dir>/prepend/ are folded into the
# system prompt; files in <dir>/append/ become a trailing message. Name files
# NNNN_something.md — the number orders them. See context.d/README.md.
[context_files]
dir = "context.d"

# Prompt-store root (docs/design/portal). Holds operator overrides the `PromptStore`
# seam manages: <dir>/system.md (overrides [agent] system_prompt for the next run),
# <dir>/lens/<mode>.md (overrides a per-mode compaction lens — read live by the
# mode-aware context strategy), and <dir>/modes/<mode>/NNNN_*.md (tagged situational
# system fragments — a `mode:<mode>` fragment folded into the turn's system prompt,
# read live by the resolver; frontmatter `tags: [..]` adds finer tags for the
# management surface — docs/design/prompts/). A missing dir means "compiled defaults",
# so this is purely opt-in. Serve the CRUD surface with `agent --serve-prompt`.
[prompts]
# backend: "file" (git-legible default) | "sqlite" (embedded DB, feature
# `prompt-sqlite`) | "grpc" (a central catalog). See docs/design/prompts/05-storage.md.
backend = "file"
dir = "prompts"
# sqlite backend only: empty ⇒ <working_dir>/.agent-seddon/prompts.db
db_path = ""

# Metrics proxy (docs/design/portal): `agent --serve-metrics-proxy` forwards PromQL
# to this Prometheus HTTP API, so a gRPC-only client (the portal) reads the same
# series Grafana does — reusing any panel query verbatim. Read-only + fail-soft
# (a bad/unreachable upstream yields an empty result with a class-only error).
[metrics_proxy]
prometheus_url = "http://127.0.0.1:9090"

# Prometheus metrics about the running agent: loop-level counters (API calls,
# tokens, context size, tool calls, iterations, run outcome) plus per-component
# series recorded at each seam (provider request/TTFT, tool exec latency, memory
# recall/append, context assemble/compact, policy authorize). When enabled, a
# /metrics endpoint is served on `listen`; scrape it with Prometheus + Grafana
# (`nix run .#prometheus-up` / `.#grafana-up`, see docs/metrics.md). A
# `--serve-<seam>` process serves its own /metrics on the seam's port (9601-9605).
# Set `pushgateway` to also push on exit (useful for short one-shot runs).
[metrics]
enabled     = true
listen      = "127.0.0.1:9600"
pushgateway = ""                # e.g. "http://localhost:9091"
job         = "agent-seddon"

# gRPC seam transports. A seam set to `= "grpc"` (e.g. `[agent] provider = "grpc"`)
# dials `endpoint`; `agent --serve-<seam>` binds `listen`. Both default (when
# empty/omitted) to 127.0.0.1:<port> using the generated ports (provider 50051,
# memory 50052, tools 50053, context 50054, policy 50055, search 50056, repo 50057,
# session 50058, scanner 50059, reference 50060, scheduler 50061,
# tokenizer 50062, embed 50063, web 50064, web_search 50065, sandbox 50066,
# pty 50067, forge 50068, tasks 50069, lsp 50070, episodic 50071,
# semantic 50072).
# Use `unix:/path` for a same-host, TCP-bypassing socket. See docs/grpc.md.
#
# Overload admission (docs/design/loadtest): a served process (`--serve-<seam>` /
# `--serve-all`) caps concurrent in-flight requests; over the cap it sheds new ones
# with gRPC RESOURCE_EXHAUSTED + a `grpc-retry-pushback-ms` hint, so clients back off
# (bounded, jittered) instead of piling on. Absent ⇒ a protective default (1024);
# `0` ⇒ unbounded (off). One process-wide cap, applied uniformly to every seam.
# [grpc]
# max_in_flight = 1024
#
# [grpc.provider]
# endpoint = "unix:/tmp/agent-seddon/provider.sock"   # client dials this
# listen   = "unix:/tmp/agent-seddon/provider.sock"   # --serve-provider binds this
# [grpc.tools]
# endpoint = "http://tool-worker:50053"               # remote tool worker (opt-in)
# [grpc.repo]
# endpoint = "unix:/tmp/agent-seddon/repo.sock"       # a git gateway (backend = "grpc")
# [grpc.session]
# endpoint = "http://session-store:50058"             # shared history ([session] backend = "grpc")
# [grpc.scanner]
# endpoint = "http://security:50059"                  # central ruleset ([scanner] rules = ["grpc"])
# [grpc.reference]
# endpoint = "http://repo-worker:50060"               # remote @-expansion ([reference] backend = "grpc")
# [grpc.scheduler]
# listen   = "unix:/tmp/agent-seddon/scheduler.sock"  # --serve-scheduler (management only; see below)
# [grpc.tokenizer]
# endpoint = "http://tokenizer:50062"                 # one count for a fleet ([tokenizer] backend = "grpc")
# [grpc.embed]
# endpoint = "http://gpu-host:50063"                  # embedding host ([embedder] backend = "grpc")
# [grpc.web]
# endpoint = "http://egress:50064"                    # egress host ([web] backend = "grpc")
# [grpc.web_search]
# endpoint = "http://egress:50065"                    # search keys stay there ([web_search] backends = ["grpc"])
#
# DANGEROUS — read before enabling. `--serve-sandbox` and `--serve-pty` accept a
# command string and RUN it, and the transport is unauthenticated by design.
# Anyone who can reach these sockets can execute code on the serving host as the
# serving user. Keep them on a unix socket (0o600 in a 0o700 dir) or loopback;
# never bind them to a routable address.
# [grpc.sandbox]
# endpoint = "unix:/tmp/agent-seddon/sandbox.sock"    # remote exec ([sandbox] backend = "grpc")
# [grpc.pty]
# endpoint = "unix:/tmp/agent-seddon/pty.sock"        # remote terminal ([pty] backend = "grpc")
#
# `--serve-forge` performs authenticated WRITES to the hosting platform (opens
# PRs, comments, reviews) on behalf of whoever reaches it. Same socket caveat as
# above, different blast radius. The upside: the platform token lives in ONE
# process, so an agent can open a PR without holding a token that could also
# delete a repository.
# [grpc.forge]
# endpoint = "unix:/tmp/agent-seddon/forge.sock"      # ([forge] backend = "grpc" is not needed; see docs)
# [grpc.tasks]
# endpoint = "http://plan:50069"                      # a shared plan ([tasks] backend = "grpc")
# [grpc.lsp]
# endpoint = "http://lsp-host:50070"                  # a warm index ([lsp] backend = "grpc")
#
# The memory LAYERS, hosted individually — the append-only log and the semantic
# store can live on different hosts. Only available when `[memory] semantic`
# composes them; an unlayered store is a single facade served by --serve-memory.
# [grpc.episodic]
# endpoint = "http://log-host:50071"                  # ([memory] backend = "grpc")
# [grpc.semantic]
# endpoint = "http://vector-host:50072"               # ([memory] semantic = "grpc")
#
# Live agent-session observation (docs/design/portal). Setting `listen` makes a
# RUNNING agent (a one-shot goal or the REPL) also host `AgentSessionService` on
# that endpoint, sharing the live loop's event stream + status snapshot — this is
# how the portal's "agent view" attaches to a running agent. Empty ⇒ off (default);
# observe-only, no way to drive the agent. Default port 50078.
# [grpc.session_stream]
# listen = "127.0.0.1:50078"                          # observe this running agent
#
# `agent --serve-all` hosts every enabled seam in ONE process on ONE endpoint,
# so a same-host deployment isn't one process per seam. Seams whose impl is
# disabled in this build/config are skipped with a warning rather than failing
# the process. Clients still dial the individual seam service by name — the
# gateway is not itself a seam, so only `listen` is meaningful here.
# [grpc.gateway]
# listen = "unix:/tmp/agent-seddon/gateway.sock"      # default 127.0.0.1:50100
#
# Every seam process also serves the standard `grpc.health.v1.Health` service, so
# a k8s `grpc` probe or any off-the-shelf balancer can check it with no
# agent-specific knowledge. SERVING means "up and this seam's adapter is wired",
# NOT that the backing impl is healthy — see docs/grpc.md.

# [policy] configures two independent things: the `allow-list` rules and the guard.
#
# `guard` wraps WHATEVER `[agent] policy` you selected and screens each call for
# dangerous shell commands (`rm -rf /`, `curl … | sh`, `chmod 777`, fork bombs, …)
# and writes to sensitive paths (`.env`, `.ssh/`, `.git/`, `/etc/`, credentials).
#   "prompt" (default) — ask the operator to confirm a flagged call; a hard deny
#                        when stdin is not a TTY (so unattended runs fail safe).
#   "deny"             — block a flagged call outright, no prompt.
#   "off"              — disable screening (e.g. `--serve-mcp`, where stdin is the
#                        JSON-RPC channel and can't take a prompt).
# `deny_paths` adds sensitive-path globs; `allow_paths` exempts paths from the guard.
#
# `allow` is only used when [agent] policy = "allow-list": allow a tool whose name
# matches `tool` (a `*` glob) and, if `arg` is set, whose arguments contain that
# substring. Everything else is denied. Empty ⇒ deny all.
# [policy]
# guard      = "prompt"                 # "prompt" | "deny" | "off"
# deny_paths = ["deploy/*.key", "*.pem"]
# allow_paths = [".env.example"]
# allow = [
#   { tool = "read_file" },
#   { tool = "grep" },
#   { tool = "git_*" },
#   { tool = "bash", arg = "ls" },
# ]
