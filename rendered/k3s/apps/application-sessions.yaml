---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/component: sessions
    app.kubernetes.io/name: sessions
    app.kubernetes.io/part-of: agent-seddon
  name: sessions
  namespace: argocd
spec:
  destination:
    namespace: agent-seddon
    server: "https://kubernetes.default.svc"
  project: default
  source:
    directory:
      exclude: application.yaml
    path: rendered/k3s/sessions
    repoURL: "https://github.com/randomizedcoder/agent-seddon"
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
