---
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/component: allow-agent-seddon-ca
    app.kubernetes.io/name: allow-agent-seddon-ca
    app.kubernetes.io/part-of: agent-seddon
  name: allow-agent-seddon-ca
spec:
  allowed:
    commonName:
      required: true
      value: agent-seddon-ca
    isCA: true
  constraints:
    maxDuration: 87600h
    privateKey:
      algorithm: ECDSA
      maxSize: 256
      minSize: 256
  selector:
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: selfsigned-bootstrap
    namespace:
      matchNames:
        - cert-manager
