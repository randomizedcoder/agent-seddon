---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/component: fleet
    app.kubernetes.io/name: fleet
    app.kubernetes.io/part-of: agent-seddon
  name: fleet
  namespace: agent-seddon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet
  template:
    metadata:
      labels:
        app.kubernetes.io/component: fleet
        app.kubernetes.io/name: fleet
        app.kubernetes.io/part-of: agent-seddon
    spec:
      containers:
        - args:
            - "--serve-fleet"
            - "--config"
            - /etc/agent/agent.toml
          image: "agent-seddon/agent:dpbg9qjy7vmczk1dwj7cghb634hw9drk"
          livenessProbe:
            exec:
              command:
                - /bin/grpc-health-probe
                - "-addr=127.0.0.1:50086"
                - "-tls"
                - "-tls-ca-cert=/etc/agent/tls/ca.crt"
                - "-tls-client-cert=/etc/agent/tls/tls.crt"
                - "-tls-client-key=/etc/agent/tls/tls.key"
                - "-tls-server-name=fleet"
                - "-connect-timeout=2s"
                - "-rpc-timeout=2s"
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          name: agent
          ports:
            - containerPort: 50086
              name: grpc
            - containerPort: 9636
              name: metrics
          readinessProbe:
            exec:
              command:
                - /bin/grpc-health-probe
                - "-addr=127.0.0.1:50086"
                - "-tls"
                - "-tls-ca-cert=/etc/agent/tls/ca.crt"
                - "-tls-client-cert=/etc/agent/tls/tls.crt"
                - "-tls-client-key=/etc/agent/tls/tls.key"
                - "-tls-server-name=fleet"
                - "-connect-timeout=2s"
                - "-rpc-timeout=2s"
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            exec:
              command:
                - /bin/grpc-health-probe
                - "-addr=127.0.0.1:50086"
                - "-tls"
                - "-tls-ca-cert=/etc/agent/tls/ca.crt"
                - "-tls-client-cert=/etc/agent/tls/tls.crt"
                - "-tls-client-key=/etc/agent/tls/tls.key"
                - "-tls-server-name=fleet"
                - "-connect-timeout=2s"
                - "-rpc-timeout=2s"
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /etc/agent
              name: config
              readOnly: true
            - mountPath: /etc/agent/tls
              name: tls
              readOnly: true
            - mountPath: /tmp
              name: tmp
            - mountPath: /home/agent
              name: home
      volumes:
        - configMap:
            name: fleet-config
          name: config
        - name: tls
          secret:
            secretName: tls-fleet
        - emptyDir: {}
          name: tmp
        - emptyDir: {}
          name: home
