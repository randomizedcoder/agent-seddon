---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: agent-seddon
  name: gateway
  namespace: agent-seddon
spec:
  dnsNames:
    - gateway
    - gateway.agent-seddon
    - gateway.agent-seddon.svc
  duration: 24h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: agent-seddon-ca
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  renewBefore: 8h
  secretName: tls-gateway
  uris:
    - "spiffe://agent.l2/svc/gateway"
  usages:
    - server auth
    - client auth
    - digital signature
