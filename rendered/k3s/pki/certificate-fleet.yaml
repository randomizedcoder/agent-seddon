---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/component: fleet
    app.kubernetes.io/name: fleet
    app.kubernetes.io/part-of: agent-seddon
  name: fleet
  namespace: agent-seddon
spec:
  dnsNames:
    - fleet
    - fleet.agent-seddon
    - fleet.agent-seddon.svc
  duration: 24h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: agent-seddon-ca
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  renewBefore: 8h
  secretName: tls-fleet
  uris:
    - "spiffe://agent.l2/svc/fleet"
  usages:
    - server auth
    - client auth
    - digital signature
