---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/component: sessions
    app.kubernetes.io/name: sessions
    app.kubernetes.io/part-of: agent-seddon
  name: sessions
  namespace: agent-seddon
spec:
  dnsNames:
    - sessions
    - sessions.agent-seddon
    - sessions.agent-seddon.svc
  duration: 24h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: agent-seddon-ca
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  renewBefore: 8h
  secretName: tls-sessions
  uris:
    - "spiffe://agent.l2/svc/sessions"
  usages:
    - server auth
    - client auth
    - digital signature
