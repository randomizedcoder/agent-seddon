---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/component: token-signer
    app.kubernetes.io/name: token-signer
    app.kubernetes.io/part-of: agent-seddon
  name: token-signer
  namespace: agent-seddon
spec:
  duration: 2160h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: agent-seddon-ca
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Never
    size: 256
  renewBefore: 360h
  secretName: token-signer
  uris:
    - "spiffe://agent.l2/svc/token-signer"
  usages:
    - digital signature
