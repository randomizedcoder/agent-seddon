---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/component: sessions
    app.kubernetes.io/name: sessions
    app.kubernetes.io/part-of: agent-seddon
  name: sessions
  namespace: agent-seddon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sessions
  template:
    metadata:
      labels:
        app.kubernetes.io/component: sessions
        app.kubernetes.io/name: sessions
        app.kubernetes.io/part-of: agent-seddon
    spec:
      containers:
        - args:
            - "--serve-sessions"
            - "--config"
            - /etc/agent/agent.toml
          image: "agent-seddon/agent:lb8ww6n8sqw05zfn44b4gxh80db7349x"
          livenessProbe:
            exec:
              command:
                - /bin/grpc-health-probe
                - "-addr=127.0.0.1:50080"
                - "-tls"
                - "-tls-ca-cert=/etc/agent/tls/ca.crt"
                - "-tls-client-cert=/etc/agent/tls/tls.crt"
                - "-tls-client-key=/etc/agent/tls/tls.key"
                - "-tls-server-name=sessions"
                - "-connect-timeout=2s"
                - "-rpc-timeout=2s"
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          name: agent
          ports:
            - containerPort: 50080
              name: grpc
            - containerPort: 9630
              name: metrics
          readinessProbe:
            exec:
              command:
                - /bin/grpc-health-probe
                - "-addr=127.0.0.1:50080"
                - "-tls"
                - "-tls-ca-cert=/etc/agent/tls/ca.crt"
                - "-tls-client-cert=/etc/agent/tls/tls.crt"
                - "-tls-client-key=/etc/agent/tls/tls.key"
                - "-tls-server-name=sessions"
                - "-connect-timeout=2s"
                - "-rpc-timeout=2s"
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            exec:
              command:
                - /bin/grpc-health-probe
                - "-addr=127.0.0.1:50080"
                - "-tls"
                - "-tls-ca-cert=/etc/agent/tls/ca.crt"
                - "-tls-client-cert=/etc/agent/tls/tls.crt"
                - "-tls-client-key=/etc/agent/tls/tls.key"
                - "-tls-server-name=sessions"
                - "-connect-timeout=2s"
                - "-rpc-timeout=2s"
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /etc/agent
              name: config
              readOnly: true
            - mountPath: /etc/agent/tls
              name: tls
              readOnly: true
            - mountPath: /etc/agent/token
              name: token
              readOnly: true
            - mountPath: /tmp
              name: tmp
            - mountPath: /home/agent
              name: home
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsUser: 10001
      volumes:
        - configMap:
            name: sessions-config
          name: config
        - name: tls
          secret:
            defaultMode: 288
            secretName: tls-sessions
        - name: token
          secret:
            defaultMode: 288
            items:
              - key: tls.key
                path: tls.key
            secretName: token-signer
        - emptyDir: {}
          name: tmp
        - emptyDir: {}
          name: home
