---
apiVersion: v1
data:
  agent.toml: |
    # gateway role — rendered by nix/k8s/components/gateway.nix.
    # Do not edit by hand; run `nix run .#k8s-render-manifests`.

    # Placeholder model wiring until K8: the loader requires [agent] + [provider],
    # but no K3 role calls a model, so the provider is a closed loopback port.
    [agent]
    provider = "openai-compat"

    [provider]
    base_url = "http://127.0.0.1:1/v1"
    model = "unwired-until-k8"

    # Until K5 renders `mode = "oidc"` + `[auth.mtls] bindings`, the roles run
    # `mode = "none"` on a routable pod address, which the S1 listen guard refuses
    # unless accepted here. The listener stays strict mTLS (`[grpc.tls] client_ca`,
    # enforced by k8s-render-tests `insecure-listen-needs-mtls`): only a cluster-CA
    # cert holder connects, but such a peer can assert any tenant. Warns every start.
    [auth]
    allow_insecure_listen = true

    # `--serve-all` hosts every enabled seam on one port. On a cluster Service the
    # exec seams must not get a listener (docs/design/k8s/08); an unknown name here
    # is a config-load error (crates/agent-cli, #580).
    [grpc.gateway]
    listen = "0.0.0.0:50100"
    exclude = ["sandbox", "pty", "forge"]

    # rustls mTLS from the cert-manager Secret `tls-gateway` (kubernetes.io/tls),
    # mounted read-only at /etc/agent/tls. Cilium must never terminate this.
    [grpc.tls]
    cert = "/etc/agent/tls/tls.crt"
    key = "/etc/agent/tls/tls.key"
    client_ca = "/etc/agent/tls/ca.crt"

    [metrics]
    listen = "0.0.0.0:9700"
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: agent-seddon
  name: gateway-config
  namespace: agent-seddon
