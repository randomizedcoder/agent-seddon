---
apiVersion: v1
data:
  agent.toml: |
    # gateway role — rendered by nix/k8s/components/gateway.nix.
    # Do not edit by hand; run `nix run .#k8s-render-manifests`.

    # Placeholder model wiring until K8: the loader requires [agent] + [provider],
    # but no K3 role calls a model, so the provider is a closed loopback port.
    [agent]
    provider = "openai-compat"

    [provider]
    base_url = "http://127.0.0.1:1/v1"
    model = "unwired-until-k8"

    # Service-only: no login issuer until K6. Only a certificate bound below can
    # sign in, and only over the strict-mTLS listener.
    [auth]
    mode = "oidc"

    [auth.token]
    issuer = "spiffe://agent.l2"
    audience = "agent-seddon"
    signing_key = "/etc/agent/token/tls.key"

    [auth.mtls]

    [[auth.mtls.bindings]]
    san = "spiffe://agent.l2/svc/gateway"
    service = "gateway"
    tenant = "agent-seddon"
    roles = ["svc_seam"]

    [[auth.mtls.bindings]]
    san = "spiffe://agent.l2/svc/sessions"
    service = "sessions"
    tenant = "agent-seddon"
    roles = ["svc_seam"]

    [[auth.mtls.bindings]]
    san = "spiffe://agent.l2/svc/fleet"
    service = "fleet"
    tenant = "agent-seddon"
    roles = ["svc_fleet"]

    # `--serve-all` hosts every enabled seam on one port. On a cluster Service the
    # exec seams must not get a listener (docs/design/k8s/08); an unknown name here
    # is a config-load error (crates/agent-cli, #580).
    [grpc.gateway]
    listen = "0.0.0.0:50100"
    exclude = ["sandbox", "pty", "forge"]

    [grpc.tls]
    cert = "/etc/agent/tls/tls.crt"
    key = "/etc/agent/tls/tls.key"
    client_ca = "/etc/agent/tls/ca.crt"
    # The Secret renews with no signal; reload on file change (K4).
    reload_poll_secs = 30

    [grpc.tls.client]
    ca = "/etc/agent/tls/ca.crt"
    cert = "/etc/agent/tls/tls.crt"
    key = "/etc/agent/tls/tls.key"

    [metrics]
    listen = "0.0.0.0:9700"
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: agent-seddon
  name: gateway-config
  namespace: agent-seddon
