# @generated config — auto-loads dashboards from the mounted dashboards dir.
apiVersion: 1

providers:
  - name: agent-seddon
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    # The dashboards dir is a read-only store mount: a UI save could not be written back.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
